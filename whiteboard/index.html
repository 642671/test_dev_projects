<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白板</title>
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --border: #d9dce1;
  --text: #1f2328;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --danger: #dc2626;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}
#board {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; background: #ffffff; cursor: crosshair; touch-action: none;
}
#board.panning { cursor: grab; }
#board.selecting { cursor: default; }

#toolbar {
  position: absolute; top: 12px; left: 12px; z-index: 10;
  display: flex; flex-direction: column; gap: 8px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  user-select: none;
}
.group { display: flex; flex-direction: column; gap: 4px; }
.group-title {
  font-size: 11px; color: var(--muted); padding: 0 2px; letter-spacing: .05em;
}
.row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
button.tool {
  width: 34px; height: 34px; padding: 6px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--panel); cursor: pointer; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
}
button.tool:hover { background: var(--accent-soft); }
button.tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
button.tool svg { width: 20px; height: 20px; }
button.plain {
  height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px;
}
button.plain:hover { background: var(--accent-soft); }
button.plain.danger:hover { background: #fef2f2; color: var(--danger); border-color: #fecaca; }

.swatch {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0;
}
.swatch.active { box-shadow: 0 0 0 2px var(--accent); }
input[type=range] { width: 110px; accent-color: var(--accent); }
.size-label { font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; }

#statusbar {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(31,35,40,.86); color: #fff; border-radius: 999px;
  padding: 6px 14px; font-size: 12px; user-select: none; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
#zoomctl {
  position: absolute; bottom: 12px; right: 12px; z-index: 10;
  display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
#zoomctl button {
  width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--panel); cursor: pointer; font-size: 15px; color: var(--text);
}
#zoomctl button:hover { background: var(--accent-soft); }
#zoomctl span { display: inline-flex; align-items: center; padding: 0 8px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <canvas id="board"></canvas>

  <div id="toolbar" aria-label="工具">
    <div class="group">
      <div class="row">
        <button class="tool active" data-tool="select" title="选择 / 移动 (V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
        </button>
        <button class="tool" data-tool="pen" title="画笔 (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </button>
        <button class="tool" data-tool="highlighter" title="荧光笔 (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4l8 8z"/></svg>
        </button>
        <button class="tool" data-tool="arrow" title="箭头 (A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
        </button>
        <button class="tool" data-tool="line" title="直线 (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
        </button>
        <button class="tool" data-tool="rect" title="矩形 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
        </button>
        <button class="tool" data-tool="ellipse" title="椭圆 (O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="8"/></svg>
        </button>
        <button class="tool" data-tool="text" title="文字 (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>
        </button>
        <button class="tool" data-tool="sticky" title="便签">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v12l-4 4H4z"/><path d="M20 16h-4v4"/></svg>
        </button>
        <button class="tool" data-tool="eraser" title="橡皮擦 (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M20.5 10.5a2.1 2.1 0 0 0 0-3L14 1a2.1 2.1 0 0 0-3 0L3.6 8.4a2.1 2.1 0 0 0 0 3l6.5 6.5a2.1 2.1 0 0 0 3 0z"/></svg>
        </button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">颜色</div>
      <div class="row" id="colors">
        <button class="swatch active" data-color="#1f2328" style="background:#1f2328" title="黑色"></button>
        <button class="swatch" data-color="#dc2626" style="background:#dc2626" title="红色"></button>
        <button class="swatch" data-color="#f59e0b" style="background:#f59e0b" title="橙色"></button>
        <button class="swatch" data-color="#16a34a" style="background:#16a34a" title="绿色"></button>
        <button class="swatch" data-color="#2563eb" style="background:#2563eb" title="蓝色"></button>
        <button class="swatch" data-color="#7c3aed" style="background:#7c3aed" title="紫色"></button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <input type="range" id="size" min="1" max="60" value="4" title="线条粗细 / 字号">
        <span class="size-label" id="sizeLabel">4</span>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <button class="plain" id="undo" title="撤销 (Ctrl+Z)">撤销</button>
        <button class="plain" id="redo" title="重做 (Ctrl+Shift+Z)">重做</button>
      </div>
      <div class="row">
        <button class="plain" id="exportPng" title="导出当前内容为 PNG">导出 PNG</button>
        <button class="plain" id="saveJson" title="保存为 JSON 文件">保存</button>
        <button class="plain" id="loadJson" title="从 JSON 文件载入">载入</button>
      </div>
      <div class="row">
        <button class="plain" id="fitView" title="重置视图">适应视图</button>
        <button class="plain danger" id="clearAll" title="清空全部内容">清空</button>
      </div>
    </div>
  </div>

  <div id="zoomctl">
    <button id="zoomOut" title="缩小">−</button>
    <button id="zoomIn" title="放大">+</button>
    <button id="zoomReset" title="100%">1:1</button>
    <span id="zoomLabel">100%</span>
  </div>

  <div id="statusbar">滚轮缩放 · 空格+拖动平移 · 双击文字/便签编辑 · 快捷键 V/P/A/R/T/E</div>
  <input type="file" id="loadFile" accept=".json,application/json" hidden>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const LS_KEY = "local.whiteboard.v1";

  // ---- state ----
  const state = {
    tool: "select",
    color: "#1f2328",
    size: 4,
    shapes: [],
    selectedId: null,
    pan: { x: 0, y: 0 },
    zoom: 1,
    history: [],
    historyIndex: -1,
    saved: null,
    drag: null,
    spaceHeld: false,
    panning: false,
    hoveredId: null,
  };

  let uid = 1;

  // ---- helpers ----
  function newId() { return "s" + (uid++); }

  function rectOf(s) {
    if (s.type === "pen") {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of s.points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }
    if (s.type === "arrow" || s.type === "line") {
      return {
        x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2),
        w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1),
      };
    }
    if (s.type === "text") {
      ctx.font = (s.fontSize || 24) + "px 'Segoe UI','Microsoft YaHei',sans-serif";
      const tw = ctx.measureText(s.text || "").width;
      const th = s.fontSize || 24;
      return { x: s.x, y: s.y - th, w: tw, h: th };
    }
    return { x: s.x, y: s.y, w: s.w, h: s.h };
  }

  function textWidth(s) {
    ctx.font = (s.fontSize || 24) + "px 'Segoe UI','Microsoft YaHei',sans-serif";
    return ctx.measureText(s.text || "").width;
  }

  function contentBounds() {
    if (!state.shapes.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of state.shapes) {
      const r = rectOf(s);
      minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
      maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  // ---- history ----
  function snapshot() {
    return JSON.parse(JSON.stringify(state.shapes));
  }

  function commit(nextShapes) {
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(nextShapes);
    if (state.history.length > 200) state.history.shift();
    state.historyIndex = state.history.length - 1;
    state.shapes = nextShapes;
    scheduleSave();
    render();
  }

  function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    state.shapes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
    scheduleSave(); render();
  }

  function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    state.shapes = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
    scheduleSave(); render();
  }

  function beginHistory() {
    commit(snapshot());
  }

  // ---- persistence ----
  function scheduleSave() {
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ shapes: state.shapes }));
      } catch (e) { /* storage may be unavailable */ }
    }, 250);
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data.shapes)) {
        state.shapes = data.shapes;
        for (const s of state.shapes) uid = Math.max(uid, (parseInt(String(s.id).slice(1), 10) || 0) + 1);
        commit(snapshot());
      }
    } catch (e) { /* ignore corrupted saves */ }
  }

  // ---- coordinate transforms ----
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    render();
  }

  function toWorld(px, py) {
    const dpr = window.devicePixelRatio || 1;
    const sx = (px - state.pan.x) / state.zoom;
    const sy = (py - state.pan.y) / state.zoom;
    return { x: sx, y: sy };
  }

  // ---- hit testing ----
  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  function hitTest(wx, wy) {
    for (let i = state.shapes.length - 1; i >= 0; i--) {
      const s = state.shapes[i];
      const r = rectOf(s);
      const pad = 8 / state.zoom;
      if (wx < r.x - pad || wx > r.x + r.w + pad || wy < r.y - pad || wy > r.y + r.h + pad) continue;
      if (s.type === "pen") {
        const pts = s.points;
        for (let j = 1; j < pts.length; j++) {
          if (distToSegment(wx, wy, pts[j - 1].x, pts[j - 1].y, pts[j].x, pts[j].y) < (s.size / 2 + 6 / state.zoom)) return s;
        }
        if (pts.length === 1 && Math.hypot(wx - pts[0].x, wy - pts[0].y) < 6 / state.zoom) return s;
      } else if (s.type === "arrow" || s.type === "line") {
        if (distToSegment(wx, wy, s.x1, s.y1, s.x2, s.y2) < Math.max(6 / state.zoom, s.size / 2)) return s;
      } else if (s.type === "ellipse") {
        const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
        const rx = Math.abs(s.w) / 2 || 1, ry = Math.abs(s.h) / 2 || 1;
        const d = ((wx - cx) * (wx - cx)) / (rx * rx) + ((wy - cy) * (wy - cy)) / (ry * ry);
        if (d <= 1 + 8 / state.zoom) return s;
      } else if (s.type === "text") {
        const tw = textWidth(s);
        const th = s.fontSize || 24;
        if (wx >= s.x && wx <= s.x + tw + 4 && wy >= s.y - th && wy <= s.y + 4) return s;
      } else {
        return s;
      }
    }
    return null;
  }

  // ---- rendering ----
  function render() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);

    // grid
    const gridStep = 40;
    ctx.save();
    ctx.translate(state.pan.x, state.pan.y);
    ctx.scale(state.zoom, state.zoom);
    ctx.strokeStyle = "#eef0f3";
    ctx.lineWidth = 1 / state.zoom;
    ctx.beginPath();
    const x0 = Math.floor((-state.pan.x) / state.zoom / gridStep) * gridStep;
    const y0 = Math.floor((-state.pan.y) / state.zoom / gridStep) * gridStep;
    const x1 = (-state.pan.x + w) / state.zoom;
    const y1 = (-state.pan.y + h) / state.zoom;
    for (let gx = x0; gx <= x1; gx += gridStep) { ctx.moveTo(gx, y0); ctx.lineTo(gx, y1); }
    for (let gy = y0; gy <= y1; gy += gridStep) { ctx.moveTo(x0, gy); ctx.lineTo(x1, gy); }
    ctx.stroke();

    for (const s of state.shapes) drawShape(s, s.id === state.selectedId);
    ctx.restore();

    document.getElementById("zoomLabel").textContent = Math.round(state.zoom * 100) + "%";
  }

  function drawShape(s, selected) {
    ctx.save();
    if (s.type === "pen") {
      if (s.mode === "highlighter") {
        ctx.globalAlpha = 0.35;
        ctx.globalCompositeOperation = "multiply";
      }
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      if (s.points.length) {
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
      }
      ctx.stroke();
    } else if (s.type === "arrow" || s.type === "line") {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      if (s.type === "arrow") {
        const angle = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        const head = Math.max(10, s.size * 3.2);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - head * Math.cos(angle - 0.42), s.y2 - head * Math.sin(angle - 0.42));
        ctx.lineTo(s.x2 - head * Math.cos(angle + 0.42), s.y2 - head * Math.sin(angle + 0.42));
        ctx.closePath();
        ctx.fill();
      }
    } else if (s.type === "rect") {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    } else if (s.type === "ellipse") {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.beginPath();
      ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w) / 2, Math.abs(s.h) / 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (s.type === "sticky") {
      ctx.fillStyle = "#fff3b8";
      ctx.strokeStyle = "#e2c14d";
      ctx.lineWidth = 1 / state.zoom;
      ctx.beginPath();
      ctx.roundRect(s.x, s.y, s.w, s.h, 4);
      ctx.fill();
      ctx.stroke();
      const fs = Math.max(13, Math.min(20, s.h / 4));
      ctx.fillStyle = "#4a3b00";
      ctx.font = fs + "px 'Segoe UI','Microsoft YaHei',sans-serif";
      wrapText(s.text || "", s.x + 8, s.y + fs + 6, s.w - 16, fs);
    } else if (s.type === "text") {
      ctx.fillStyle = s.color;
      ctx.font = (s.fontSize || 24) + "px 'Segoe UI','Microsoft YaHei',sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(s.text || "", s.x, s.y);
    }

    if (selected) {
      const r = rectOf(s);
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 1.5 / state.zoom;
      ctx.setLineDash([5 / state.zoom, 4 / state.zoom]);
      ctx.strokeRect(r.x - 4 / state.zoom, r.y - 4 / state.zoom, r.w + 8 / state.zoom, r.h + 8 / state.zoom);
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function wrapText(text, x, y, maxW, lineH) {
    const lines = String(text).split("\n");
    let cy = y;
    for (const line of lines) {
      if (line === "") { cy += lineH; continue; }
      let cur = "";
      for (const ch of line) {
        const test = cur + ch;
        if (ctx.measureText(test).width > maxW && cur) {
          ctx.fillText(cur, x, cy);
          cur = ch; cy += lineH;
        } else {
          cur = test;
        }
      }
      ctx.fillText(cur, x, cy);
      cy += lineH;
    }
  }

  // ---- creation ----
  function createShape(partial) {
    return Object.assign({ id: newId(), color: state.color, size: state.size }, partial);
  }

  function setTool(tool) {
    state.tool = tool;
    state.selectedId = null;
    document.querySelectorAll("button.tool").forEach(b => b.classList.toggle("active", b.dataset.tool === tool));
    canvas.classList.toggle("selecting", tool === "select");
    render();
  }

  // ---- pointer handling ----
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button === 1 || state.spaceHeld) {
      state.panning = true;
      state.drag = { mode: "pan", startX: e.clientX, startY: e.clientY, panX: state.pan.x, panY: state.pan.y };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add("panning");
      return;
    }
    if (e.button !== 0) return;

    const pos = pointerPos(e);
    const wpt = toWorld(pos.x, pos.y);

    if (state.tool === "select") {
      const hit = hitTest(wpt.x, wpt.y);
      state.selectedId = hit ? hit.id : null;
      if (hit) {
        const start = rectOf(hit);
        state.drag = { mode: "move", id: hit.id, startX: wpt.x, startY: wpt.y, orig: start, moved: false };
      } else {
        state.drag = { mode: "pan", startX: e.clientX, startY: e.clientY, panX: state.pan.x, panY: state.pan.y };
      }
      canvas.setPointerCapture(e.pointerId);
      render();
      return;
    }

    if (state.tool === "text") {
      const text = prompt("输入文字：", "文字");
      if (text != null && text !== "") {
        beginHistory();
        state.shapes.push(createShape({ type: "text", x: wpt.x, y: wpt.y, text, fontSize: Math.max(12, state.size * 6) }));
        state.selectedId = state.shapes[state.shapes.length - 1].id;
      }
      return;
    }

    if (state.tool === "sticky") {
      const text = prompt("便签内容：", "便签");
      if (text != null) {
        beginHistory();
        const w = 180, h = 96;
        state.shapes.push(createShape({ type: "sticky", x: wpt.x, y: wpt.y, w, h, text }));
        state.selectedId = state.shapes[state.shapes.length - 1].id;
      }
      return;
    }

    if (state.tool === "pen" || state.tool === "highlighter") {
      beginHistory();
      const s = createShape({ type: "pen", mode: state.tool, points: [{ x: wpt.x, y: wpt.y }] });
      state.shapes.push(s);
      state.drag = { mode: "pen", id: s.id, last: wpt };
    } else if (state.tool === "arrow" || state.tool === "line") {
      beginHistory();
      const s = createShape({ type: state.tool, x1: wpt.x, y1: wpt.y, x2: wpt.x, y2: wpt.y });
      state.shapes.push(s);
      state.drag = { mode: "line", id: s.id, anchor: wpt };
    } else {
      beginHistory();
      const s = createShape({ type: state.tool, x: wpt.x, y: wpt.y, w: 0, h: 0 });
      state.shapes.push(s);
      state.drag = { mode: "box", id: s.id, anchor: wpt };
    }
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    const pos = pointerPos(e);
    const wpt = toWorld(pos.x, pos.y);

    if (!state.drag) {
      if (state.tool === "select") {
        const hit = hitTest(wpt.x, wpt.y);
        if (hit) {
          if (state.hoveredId !== hit.id) { state.hoveredId = hit.id; canvas.style.cursor = "move"; }
        } else if (state.hoveredId) {
          state.hoveredId = null;
          canvas.style.cursor = "default";
        }
      }
      return;
    }

    const d = state.drag;
    if (d.mode === "pan") {
      state.pan.x = d.panX + (e.clientX - d.startX);
      state.pan.y = d.panY + (e.clientY - d.startY);
      render();
      return;
    }
    if (d.mode === "move") {
      const s = state.shapes.find(sh => sh.id === d.id);
      if (!s) return;
      const dx = wpt.x - d.startX, dy = wpt.y - d.startY;
      if (Math.hypot(dx, dy) > 1 / state.zoom) d.moved = true;
      if (s.type === "pen") {
        for (const p of s.points) { p.x += dx; p.y += dy; }
      } else if (s.type === "arrow" || s.type === "line") {
        s.x1 = d.orig.x + dx; s.y1 = d.orig.y + dy; s.x2 = d.orig.x + d.orig.w + dx; s.y2 = d.orig.y + d.orig.h + dy;
      } else {
        s.x = d.orig.x + dx; s.y = d.orig.y + dy;
      }
      render();
      return;
    }
    if (d.mode === "pen") {
      const s = state.shapes.find(sh => sh.id === d.id);
      if (s && Math.hypot(wpt.x - d.last.x, wpt.y - d.last.y) > 0.4 / state.zoom) {
        s.points.push({ x: wpt.x, y: wpt.y });
        d.last = wpt;
        render();
      }
      return;
    }
    if (d.mode === "line") {
      const s = state.shapes.find(sh => sh.id === d.id);
      if (s) { s.x2 = wpt.x; s.y2 = wpt.y; render(); }
      return;
    }
    if (d.mode === "box") {
      const s = state.shapes.find(sh => sh.id === d.id);
      if (s) {
        s.x = Math.min(d.anchor.x, wpt.x);
        s.y = Math.min(d.anchor.y, wpt.y);
        s.w = Math.abs(wpt.x - d.anchor.x);
        s.h = Math.abs(wpt.y - d.anchor.y);
        render();
      }
    }
  });

  function endDrag(e) {
    const d = state.drag;
    state.drag = null;
    state.panning = false;
    canvas.classList.remove("panning");
    if (d && d.mode === "move" && !d.moved) {
      // click on empty space with select -> deselect
      if (e && state.tool === "select" && !state.selectedId) render();
    }
    if (d && (d.mode === "pen" || d.mode === "line" || d.mode === "box")) {
      const s = state.shapes.find(sh => sh.id === d.id);
      if (s && s.type === "pen" && s.points.length === 1) {
        s.points.push({ x: s.points[0].x + 0.5 / state.zoom, y: s.points[0].y });
      }
      if (s && s.type !== "pen" && Math.abs(s.w || 0) < 0.01 && Math.abs(s.h || 0) < 0.01 && s.type !== "line" && s.type !== "arrow") {
        // zero-size box: turn into text
        const text = prompt("输入文字：", "文字");
        if (text != null && text !== "") {
          const i = state.shapes.indexOf(s);
          state.shapes[i] = createShape({ type: "text", x: s.x, y: s.y, text, fontSize: Math.max(12, state.size * 6) });
        } else {
          state.shapes.splice(state.shapes.indexOf(s), 1);
        }
      }
      scheduleSave();
    }
  }

  canvas.addEventListener("pointerup", (e) => { endDrag(e); });
  canvas.addEventListener("pointercancel", () => { state.drag = null; state.panning = false; canvas.classList.remove("panning"); });

  canvas.addEventListener("dblclick", (e) => {
    const pos = pointerPos(e);
    const wpt = toWorld(pos.x, pos.y);
    const hit = hitTest(wpt.x, wpt.y);
    if (hit && (hit.type === "text" || hit.type === "sticky")) {
      const text = prompt("编辑内容：", hit.text || "");
      if (text != null) {
        beginHistory();
        hit.text = text;
        if (hit.type === "text" && !text) state.shapes.splice(state.shapes.indexOf(hit), 1);
      }
    }
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const next = Math.min(8, Math.max(0.05, state.zoom * factor));
    const wx = (mx - state.pan.x) / state.zoom;
    const wy = (my - state.pan.y) / state.zoom;
    state.zoom = next;
    state.pan.x = mx - wx * state.zoom;
    state.pan.y = my - wy * state.zoom;
    render();
  }, { passive: false });

  // ---- toolbar events ----
  document.querySelectorAll("button.tool").forEach(b => {
    b.addEventListener("click", () => { setTool(b.dataset.tool); b.blur(); });
  });

  document.getElementById("colors").addEventListener("click", (e) => {
    const sw = e.target.closest(".swatch");
    if (!sw) return;
    state.color = sw.dataset.color;
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("active", s === sw));
    sw.blur();
  });

  const sizeInput = document.getElementById("size");
  sizeInput.addEventListener("input", () => {
    state.size = parseInt(sizeInput.value, 10);
    document.getElementById("sizeLabel").textContent = state.size;
  });

  document.getElementById("undo").addEventListener("click", undo);
  document.getElementById("redo").addEventListener("click", redo);
  document.getElementById("clearAll").addEventListener("click", () => {
    if (state.shapes.length && confirm("确定清空画布上的全部内容？")) {
      beginHistory();
      state.shapes = [];
      state.selectedId = null;
    }
  });
  document.getElementById("fitView").addEventListener("click", () => {
    const b = contentBounds();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!b) { state.zoom = 1; state.pan = { x: 0, y: 0 }; }
    else {
      const pad = 60;
      state.zoom = Math.min(w / (b.w + pad * 2), h / (b.h + pad * 2), 2);
      state.zoom = Math.max(state.zoom, 0.05);
      state.pan.x = (w - b.w * state.zoom) / 2 - b.x * state.zoom;
      state.pan.y = (h - b.h * state.zoom) / 2 - b.y * state.zoom;
    }
    render();
  });

  document.getElementById("zoomIn").addEventListener("click", () => {
    const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;
    const wx = (cx - state.pan.x) / state.zoom, wy = (cy - state.pan.y) / state.zoom;
    state.zoom = Math.min(8, state.zoom * 1.25);
    state.pan.x = cx - wx * state.zoom; state.pan.y = cy - wy * state.zoom;
    render();
  });
  document.getElementById("zoomOut").addEventListener("click", () => {
    const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;
    const wx = (cx - state.pan.x) / state.zoom, wy = (cy - state.pan.y) / state.zoom;
    state.zoom = Math.max(0.05, state.zoom / 1.25);
    state.pan.x = cx - wx * state.zoom; state.pan.y = cy - wy * state.zoom;
    render();
  });
  document.getElementById("zoomReset").addEventListener("click", () => {
    const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;
    const wx = (cx - state.pan.x) / state.zoom, wy = (cy - state.pan.y) / state.zoom;
    state.zoom = 1;
    state.pan.x = cx - wx; state.pan.y = cy - wy;
    render();
  });

  document.getElementById("exportPng").addEventListener("click", () => {
    const b = contentBounds();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const out = document.createElement("canvas");
    const scale = 2;
    if (!b) {
      out.width = w * scale; out.height = h * scale;
      const c = out.getContext("2d");
      c.fillStyle = "#fff"; c.fillRect(0, 0, out.width, out.height);
    } else {
      const pad = 80;
      out.width = Math.max(1, Math.ceil((b.w + pad * 2) * scale));
      out.height = Math.max(1, Math.ceil((b.h + pad * 2) * scale));
      const c = out.getContext("2d");
      c.scale(scale, scale);
      c.fillStyle = "#fff"; c.fillRect(0, 0, out.width / scale, out.height / scale);
      c.translate(pad - b.x, pad - b.y);
      for (const s of state.shapes) drawShapeExport(c, s);
    }
    const a = document.createElement("a");
    a.download = "whiteboard.png";
    a.href = out.toDataURL("image/png");
    a.click();
  });

  function drawShapeExport(c, s) {
    c.save();
    c.lineWidth = s.size; c.strokeStyle = s.color; c.fillStyle = s.color;
    c.lineCap = "round"; c.lineJoin = "round";
    if (s.type === "pen") {
      if (s.mode === "highlighter") { c.globalAlpha = 0.35; c.globalCompositeOperation = "multiply"; }
      c.beginPath(); c.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y);
      c.stroke();
    } else if (s.type === "arrow" || s.type === "line") {
      c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.stroke();
      if (s.type === "arrow") {
        const angle = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        const head = Math.max(10, s.size * 3.2);
        c.beginPath(); c.moveTo(s.x2, s.y2);
        c.lineTo(s.x2 - head * Math.cos(angle - 0.42), s.y2 - head * Math.sin(angle - 0.42));
        c.lineTo(s.x2 - head * Math.cos(angle + 0.42), s.y2 - head * Math.sin(angle + 0.42));
        c.closePath(); c.fill();
      }
    } else if (s.type === "rect") {
      c.strokeRect(s.x, s.y, s.w, s.h);
    } else if (s.type === "ellipse") {
      c.beginPath(); c.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w) / 2, Math.abs(s.h) / 2, 0, 0, Math.PI * 2); c.stroke();
    } else if (s.type === "sticky") {
      c.fillStyle = "#fff3b8"; c.strokeStyle = "#e2c14d"; c.lineWidth = 1;
      c.beginPath(); c.roundRect(s.x, s.y, s.w, s.h, 4); c.fill(); c.stroke();
      const fs = Math.max(13, Math.min(20, s.h / 4));
      c.fillStyle = "#4a3b00"; c.font = fs + "px 'Segoe UI','Microsoft YaHei',sans-serif";
      wrapTextExport(c, s.text || "", s.x + 8, s.y + fs + 6, s.w - 16, fs);
    } else if (s.type === "text") {
      c.font = (s.fontSize || 24) + "px 'Segoe UI','Microsoft YaHei',sans-serif";
      c.textBaseline = "top";
      c.fillText(s.text || "", s.x, s.y);
    }
    c.restore();
  }

  function wrapTextExport(c, text, x, y, maxW, lineH) {
    const lines = String(text).split("\n");
    let cy = y;
    for (const line of lines) {
      if (line === "") { cy += lineH; continue; }
      let cur = "";
      for (const ch of line) {
        const test = cur + ch;
        if (c.measureText(test).width > maxW && cur) { c.fillText(cur, x, cy); cur = ch; cy += lineH; }
        else cur = test;
      }
      c.fillText(cur, x, cy); cy += lineH;
    }
  }

  document.getElementById("saveJson").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "whiteboard", version: 1, shapes: state.shapes }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.download = "whiteboard.json";
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById("loadJson").addEventListener("click", () => document.getElementById("loadFile").click());
  document.getElementById("loadFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.shapes)) throw new Error("bad format");
        beginHistory();
        state.shapes = data.shapes;
        state.selectedId = null;
        for (const s of state.shapes) uid = Math.max(uid, (parseInt(String(s.id).slice(1), 10) || 0) + 1);
        fitView();
      } catch (err) {
        alert("载入失败：文件格式不正确");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---- keyboard ----
  document.addEventListener("keydown", (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
    if (e.key === "Delete" || e.key === "Backspace") {
      if (state.selectedId) {
        beginHistory();
        state.shapes = state.shapes.filter(s => s.id !== state.selectedId);
        state.selectedId = null;
      }
      return;
    }
    if (e.key === " ") { state.spaceHeld = true; if (!state.drag) canvas.classList.add("panning"); e.preventDefault(); return; }
    const toolMap = { v: "select", p: "pen", h: "highlighter", a: "arrow", l: "line", r: "rect", o: "ellipse", t: "text", e: "eraser" };
    if (toolMap[k]) setTool(toolMap[k]);
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === " ") { state.spaceHeld = false; if (!state.drag) canvas.classList.remove("panning"); }
  });
  window.addEventListener("blur", () => { state.spaceHeld = false; state.drag = null; state.panning = false; canvas.classList.remove("panning"); });

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ---- init ----
  function fitView() {
    const b = contentBounds();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!b) { state.zoom = 1; state.pan = { x: 0, y: 0 }; }
    else {
      const pad = 60;
      state.zoom = Math.min(w / (b.w + pad * 2), h / (b.h + pad * 2), 2);
      state.zoom = Math.max(state.zoom, 0.05);
      state.pan.x = (w - b.w * state.zoom) / 2 - b.x * state.zoom;
      state.pan.y = (h - b.h * state.zoom) / 2 - b.y * state.zoom;
    }
    render();
  }

  window.addEventListener("resize", resize);
  loadSaved();
  setTool("select");
  fitView();
})();
</script>
</body>
</html>
