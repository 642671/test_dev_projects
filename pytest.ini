[pytest]
# 测试扫描路径（按业务模块）
testpaths = test_automation/ui_automation/testcases test_automation/api_testing/testcases

# 测试文件发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认执行参数
addopts = -v --strict-markers --self-contained-html

# 日志配置
log_cli = true
log_cli_level = INFO
log_file = test_automation/logs/pytest.log
log_file_level = DEBUG

# 自定义 marker 注册
markers =
    smoke: 冒烟测试 - 核心功能快速验证
    functional: 功能测试 - 完整功能验证
    regression: 回归测试 - 全量回归验证
    sanity: 健全性测试 - 基础健全性检查
    ui: UI 自动化测试
    api: 接口测试
    slow: 执行较慢的测试
    wip: 正在开发中的测试（Work In Progress）
    critical: P0 - 阻塞性故障,核心功能 (冒烟/CI 必跑)
    high: P1 - 重要功能,影响用户体验
    medium: P2 - 次要功能,边界场景
    low: P3 - 锦上添花,UI 细节
