[pytest]
testpaths = ui_automation/testcases api_testing/testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --html=reports/html/report.html --self-contained-html

# Allure 报告目录（使用时加 --alluredir=reports/allure）
# 日志输出
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG
markers =
    smoke: 冒烟测试 - 核心功能快速验证
    functional: 功能测试 - 完整功能验证
    regression: 回归测试 - 全量回归验证
    sanity: 健全性测试 - 基础健全性检查
    ui: UI 自动化测试
    api: 接口测试
    slow: 执行较慢的测试
    wip: 正在开发中的测试（Work In Progress）
