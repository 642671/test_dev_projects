# 开发环境配置
env_name: "开发环境"

# 基础 URL
base_url: "https://dev.example.com"

# 账号信息
username: "dev_user"
password: "dev_password"

# 数据库配置
database:
  host: "localhost"
  port: 3306
  name: "dev_db"
  user: "root"
  password: "root"

# API 配置
api:
  base_url: "https://api.dev.example.com"
  timeout: 30
  token: ""

# 浏览器配置（UI 自动化使用）
browser:
  type: "chrome"
  headless: false
  implicit_wait: 10
  page_load_timeout: 30
