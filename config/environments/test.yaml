# 测试环境配置
env_name: "测试环境"

# 基础 URL
base_url: "http://192.168.64.7:8181"

# 账号信息
username: "test_user"
password: "test_password"

# 数据库配置
database:
  host: "localhost"
  port: 3306
  name: "test_db"
  user: "root"
  password: "root"

# API 配置
api:
  base_url: "https://api.test.example.com"
  timeout: 30
  token: ""

# 浏览器配置（UI 自动化使用）
browser:
  type: "chrome"
  headless: false
  implicit_wait: 10
  page_load_timeout: 30
