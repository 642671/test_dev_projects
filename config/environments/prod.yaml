# 生产环境配置
env_name: "生产环境"

# 基础 URL
base_url: "https://www.example.com"

# 账号信息
username: "prod_user"
password: "prod_password"

# 数据库配置
database:
  host: "prod-db.example.com"
  port: 3306
  name: "prod_db"
  user: "root"
  password: "root"

# API 配置
api:
  base_url: "https://api.example.com"
  timeout: 30
  token: ""

# 浏览器配置（UI 自动化使用）
browser:
  type: "chrome"
  headless: true
  implicit_wait: 10
  page_load_timeout: 30
