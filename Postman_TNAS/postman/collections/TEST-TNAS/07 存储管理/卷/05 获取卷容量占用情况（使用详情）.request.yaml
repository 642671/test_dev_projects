$kind: http-request
url: "{{baseUrl}}/v2/storage/volumeOccupyStatus?uuid={{lv5_uuid}}&sadas"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: uuid
    value: "{{lv5_uuid}}"
    description: 卷UUID，必填参数需要询问用户给出
  - key: sadas
    value: null
settings:
  strictSSL: false
  followRedirects: true
order: 5000
