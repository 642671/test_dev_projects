$kind: http-request
url: "{{baseUrl}}/v2/storage/edit/volume/:uuid"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  uuid: "{{lv2_uuid}}"
body:
  type: json
  content: "{\r

    \    \"description\": \"hdsa\",\r

    \    \"capacity\": 11,\r

    \    \"quota_flag\":0\r

    }"
settings:
  strictSSL: false
  followRedirects: true
order: 13000
