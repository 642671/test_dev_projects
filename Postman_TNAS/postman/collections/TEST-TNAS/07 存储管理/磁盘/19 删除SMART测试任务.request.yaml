$kind: http-request
url: "{{baseUrl}}/v2/disk/smart_test/schedule/:id"
method: DELETE
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: id
    value: "{{disk1_smart_id}}"
    description: 任务ID，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 19000
