$kind: http-request
url: "{{baseUrl}}/v2/disk/ExportIhmLog?device={{Ihm1_device}}"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
queryParams:
  - key: device
    value: "{{Ihm1_device}}"
    description: 设备路径，如/dev/sda，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
order: 39000
