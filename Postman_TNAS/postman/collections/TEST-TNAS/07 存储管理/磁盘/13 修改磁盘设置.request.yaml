$kind: http-request
url: "{{baseUrl}}/v2/disk/setting"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"cache_enabled\": true,\r

    \    \"BB_notify_enabled\": true,\r

    \    \"smartest_report\": false\r

    }"
settings:
  strictSSL: false
  followRedirects: true
order: 13000
