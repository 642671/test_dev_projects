$kind: http-request
url: "{{baseUrl}}/v1/active/:uuid"
method: PUT
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: uuid
    value: ""
    description: 设备UUID，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 44000
