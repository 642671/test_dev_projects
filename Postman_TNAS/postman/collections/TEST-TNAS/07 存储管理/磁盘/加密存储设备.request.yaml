$kind: http-request
url: "{{baseUrl}}/v1/encrypt/:action/:name/:password"
method: PUT
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: action
    value: ""
    description: 操作类型，枚举值：encrypt=加密，insert=插入
  - key: name
    value: ""
    description: 设备名称，必填参数需要询问用户给出
  - key: password
    value: ""
    description: 加密密码，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 46000
