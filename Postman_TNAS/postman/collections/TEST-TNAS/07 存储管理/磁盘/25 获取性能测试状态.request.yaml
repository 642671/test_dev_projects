$kind: http-request
url: "{{baseUrl}}/v2/disk/benchmark/status?device={{disk1_device}}"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: device
    value: "{{disk1_device}}"
    description: 设备路径，如/dev/sda，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
order: 25000
