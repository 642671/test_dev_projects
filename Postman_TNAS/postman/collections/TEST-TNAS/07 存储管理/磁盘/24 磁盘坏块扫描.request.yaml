$kind: http-request
url: "{{baseUrl}}/v2/disk/DiskScan"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: formdata
  content:
    - type: text
      key: device
      value: "{{disk1_device}}"
      description: 设备路径，如/dev/sda，必填参数需要询问用户给出
    - type: text
      key: status
      value: "2"
      description: 动作：1-开始2-停止
settings:
  strictSSL: false
  followRedirects: true
order: 24000
