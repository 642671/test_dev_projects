$kind: http-request
url: "{{baseUrl}}/v2/extStorageDevice/DownloadSecretKey?data={{src}}"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: data
    value: "{{src}}"
    description: Base64编码的密钥文件路径，由ObtainSecretKey接口返回，文本类型，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
order: 15000
