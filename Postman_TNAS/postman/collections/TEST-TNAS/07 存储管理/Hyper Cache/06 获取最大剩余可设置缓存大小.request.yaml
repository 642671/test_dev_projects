$kind: http-request
url: "{{baseUrl}}/v2/lvmCache/GetMaxResidueCacheSize?volumeUUID={{lv0_uuid}}"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: volumeUUID
    value: "{{lv0_uuid}}"
    description: 卷UUID，文本类型，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
order: 6000
