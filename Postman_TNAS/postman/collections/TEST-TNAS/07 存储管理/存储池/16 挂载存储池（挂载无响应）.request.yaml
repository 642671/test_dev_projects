$kind: http-request
url: "{{baseUrl}}/v2/storage/MountPool/:role/:uuid"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: role
    value: damagedPool
    description: 类型：availablePool=可用池, damagedPool=已损坏池，必填参数需要询问用户给出
  - key: uuid
    value: "{{corrupt_vg3_uuid }}"
    description: 存储池UUID，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 16000
