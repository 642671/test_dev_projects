$kind: http-request
url: "{{baseUrl}}/v2/storage/create/pool"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"level\":\"single\",\r

    \    \"disks\": [\"{{cp_disk_0_path}}\"]\r

    }"
settings:
  strictSSL: false
  followRedirects: true
order: 21000
