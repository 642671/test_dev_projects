$kind: http-request
url: "{{baseUrl}}/v2/storage/StopDataScrubbing"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: formdata
  content:
    - type: text
      key: raid
      value: "{{vg0_raid}}"
      description: RAID设备名，阵列名称，多个用逗号隔开，如/dev/md0
settings:
  strictSSL: false
  followRedirects: true
order: 12000
