$kind: http-request
url: '{{baseUrl}}/v2/login'
method: POST
headers:
- key: X-Csrf-Token
  value: '{{X-Csrf-Token}}'
  description: X-Csrf-Token 可以为任意值，但是必须与Headers的值一样，例如为空值的{{X-Csrf-Token}}
body:
  type: json
  content: "{\r\n    \"username\": \"NormalUser\",\r\n    \"password\": \"Admin123\"\
    ,\r\n    \"code\": \"\",\r\n    \"remember\": false,\r\n    \"slidecode\": 1\r\
    \n}"
auth:
  type: noauth
scripts:
- type: beforeRequest
  code: "var rsaEncryptPassword = function (message, keyInput) {\n  function readTLV(buf,\
    \ pos) {\n    var tag = buf[pos]; pos++;\n    var len = buf[pos]; pos++;\n   \
    \ if (len & 0x80) {\n      var n = len & 0x7f;\n      len = 0;\n      for (var\
    \ i = 0; i < n; i++) len = (len << 8) | buf[pos + i];\n      pos += n;\n    }\n\
    \    return { tag: tag, value: buf.subarray(pos, pos + len), next: pos + len };\n\
    \  }\n  function bufToBig(buf) {\n    var h = '';\n    for (var i = 0; i < buf.length;\
    \ i++) h += buf[i].toString(16).padStart(2, '0');\n    return BigInt('0x' + (h\
    \ || '0'));\n  }\n  function bigToBuf(v, k) {\n    var hex = v.toString(16);\n\
    \    if (hex.length % 2) hex = '0' + hex;\n    var out = new Uint8Array(k);\n\
    \    var idx = k;\n    for (var i = hex.length - 2; i >= 0; i -= 2) { idx--; out[idx]\
    \ = parseInt(hex.substr(i, 2), 16); }\n    return out;\n  }\n  function modPow(base,\
    \ exp, mod) {\n    var r = 1n; base %= mod;\n    while (exp > 0n) {\n      if\
    \ (exp & 1n) r = (r * base) % mod;\n      base = (base * base) % mod;\n      exp\
    \ >>= 1n;\n    }\n    return r;\n  }\n  function parsePublicKey(der) {\n    var\
    \ outer = readTLV(der, 0);\n    var first = readTLV(outer.value, 0);\n    var\
    \ second = readTLV(outer.value, first.next);\n    var rsapub = (second.tag ===\
    \ 0x03) ? second.value.subarray(1) : outer.value;\n    var seq = readTLV(rsapub,\
    \ 0);\n    var nTlv = readTLV(seq.value, 0);\n    var eTlv = readTLV(seq.value,\
    \ nTlv.next);\n    var nBig = bufToBig(nTlv.value);\n    var eBig = bufToBig(eTlv.value);\n\
    \    var k = nTlv.value.length;\n    if (nTlv.value[0] === 0) k = nTlv.value.length\
    \ - 1;\n    return { nBig: nBig, eBig: eBig, k: k };\n  }\n  function keyBytesDer(keyInput)\
    \ {\n    var key = String(keyInput).trim();\n    var pemText = null;\n    if (key.indexOf('-----BEGIN')\
    \ === 0) {\n      pemText = key;\n    } else {\n      var bin = atob(key);\n \
    \     if (bin.indexOf('-----BEGIN') === 0) pemText = bin;\n      else {\n    \
    \    var dr = new Uint8Array(bin.length);\n        for (var di = 0; di < bin.length;\
    \ di++) dr[di] = bin.charCodeAt(di);\n        return dr;\n      }\n    }\n   \
    \ var body = pemText.split(/\\r?\\n/).filter(function (l) { return l && l.indexOf('-----')\
    \ < 0; }).join('');\n    var b = atob(body);\n    var d = new Uint8Array(b.length);\n\
    \    for (var dj = 0; dj < b.length; dj++) d[dj] = b.charCodeAt(dj);\n    return\
    \ d;\n  }\n  var der = keyBytesDer(keyInput);\n  var pk = parsePublicKey(der);\n\
    \  var m = [];\n  for (var mi = 0; mi < message.length; mi++) m.push(message.charCodeAt(mi)\
    \ & 0xff);\n  if (m.length > pk.k - 11) throw new Error('message too long for\
    \ RSA');\n  var psLen = pk.k - 3 - m.length;\n  var rnd = (typeof crypto !== 'undefined'\
    \ && crypto.getRandomValues) ? function () {\n    var a = new Uint32Array(1);\
    \ crypto.getRandomValues(a); return a[0];\n  } : function () { return Math.floor(Math.random()\
    \ * 0xffffffff); };\n  var ps = [];\n  for (var pi = 0; pi < psLen; pi++) ps.push(1\
    \ + (rnd() % 255));\n  var eb = new Uint8Array(pk.k);\n  eb[0] = 0x00; eb[1] =\
    \ 0x02;\n  for (var qi = 0; qi < psLen; qi++) eb[2 + qi] = ps[qi];\n  eb[2 + psLen]\
    \ = 0x00;\n  for (var ti = 0; ti < m.length; ti++) eb[3 + psLen + ti] = m[ti];\n\
    \  var c = modPow(bufToBig(eb), pk.eBig, pk.nBig);\n  var cbuf = bigToBuf(c, pk.k);\n\
    \  var b64 = '';\n  for (var zi = 0; zi < cbuf.length; zi++) b64 += String.fromCharCode(cbuf[zi]);\n\
    \  return btoa(b64);\n};\n\n// 获取 Base64 公钥\r\nconsole.log(\"public\", pm.environment.get(\"\
    RSA_PUBLIC_KEY\"))\r\nlet base64Key = pm.environment.get(\"RSA_PUBLIC_KEY\");\r\
    \n\r\nif (!base64Key) {\r\n    throw new Error(\"未配置 RSA_PUBLIC_KEY\");\r\n}\r\
    \n\r\n// Base64 解码 → PEM 字符串\r\nlet publicKey = base64Key;\r\nconsole.log(\"public\"\
    , publicKey)\r\n// 获取请求体（JSON）\r\nlet body = JSON.parse(pm.request.body);\r\n\
    console.log(\"加密密文:\", body.password);\r\n\r\nbody.password = rsaEncryptPassword(body.password,\
    \ publicKey);\r\nconsole.log('Result:', body.password);\r\n// 写回请求体\r\npm.request.body\
    \ = JSON.stringify(body);"
  language: text/javascript
- type: afterResponse
  code: "// ======================================\r\n// 普通用户登录接口后置脚本\r\n// 功能：\r\n\
    // 1. 获取登录返回的 Cookie\r\n// 2. 获取 X-Csrf-Token\r\n// 3. 获取当前用户名\r\n// 4. 自动拼接完整\
    \ Cookie\r\n// 5. 保存到环境变量，供后续接口直接使用\r\n// ======================================\r\
    \n\r\n// 获取变量（普通用户，已由 Apifox 后置操作提取）\r\nconst tmsessname = pm.variables.get(\"\
    NormalUser_TMSESSNAME\");\r\nconst tosCurrentUsername = pm.variables.get(\"NormalUser_tos_current_username\"\
    );\r\nconst csrfToken = pm.variables.get(\"X-Csrf-Token\");\r\n\r\n// 输出日志，方便调试\r\
    \nconsole.log(\"========== 普通用户登录信息 ==========\");\r\nconsole.log(\"NormalUser_TMSESSNAME:\"\
    , tmsessname);\r\nconsole.log(\"NormalUser_tos_current_username:\", tosCurrentUsername);\r\
    \nconsole.log(\"NormalUser_X-Csrf-Token:\", csrfToken);\r\n\r\n// 使用数组拼接 Cookie，避免多余分号\r\
    \nconst cookieItems = [];\r\n\r\n// X-Csrf-Token\r\nif (csrfToken) {\r\n    cookieItems.push(`X-Csrf-Token=${csrfToken}`);\r\
    \n}\r\n\r\n// Session\r\nif (tmsessname) {\r\n    cookieItems.push(`TMSESSNAME=${tmsessname}`);\r\
    \n}\r\n\r\n// 当前用户名\r\nif (tosCurrentUsername) {\r\n    cookieItems.push(`tos_current_username=${tosCurrentUsername}`);\r\
    \n    cookieItems.push(`userName=${tosCurrentUsername}`);\r\n}\r\n\r\n// 登录状态\r\
    \ncookieItems.push(\"loginStatus=true\");\r\n\r\n// 拼接完整 Cookie\r\nconst fullCookie\
    \ = cookieItems.join(\"; \");\r\n\r\nconsole.log(\"完整 NormalUserCookie：\");\r\n\
    console.log(fullCookie);\r\n\r\n// ======================\r\n// 保存环境变量（普通用户专用）\r\
    \n// ======================\r\n\r\n// 保存 X-Csrf-Token\r\nif (csrfToken) {\r\n\
    \    pm.environment.set(\"NormalUserCsrfToken\", csrfToken);\r\n}\r\n\r\n// 保存\
    \ Cookie\r\npm.environment.set(\"NormalUserCookie\", fullCookie);\r\n\r\n// 调试输出\r\
    \nconsole.log(\"========== 已保存环境变量 ==========\");\r\nconsole.log(\"NormalUserCookie\
    \ =\", pm.environment.get(\"NormalUserCookie\"));\r\nconsole.log(\"NormalUserCsrfToken\
    \ =\", pm.environment.get(\"NormalUserCsrfToken\"));\r\n"
  language: text/javascript
settings:
  strictSSL: false
  followRedirects: true
order: 8000
