$kind: http-example
request:
  url: "{{baseUrl}}/v2/hotsparedisk/CreateHotSpareDisk"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: '{ "devices": ["{{hs1_device}}"], "RAIDS": ["{{hs1_vg}}"] }'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 49000
