$kind: http-example
name: 正常获取热备盘列表中序号与前端一致（热备盘分别是1、3、4）
request:
  url: "{{baseUrl}}/v2/hotsparedisk/GetRaidHotSpare"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 24000
