$kind: http-request
url: "{{baseUrl}}/v2/disk/disk_log/export"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/09 导出磁盘日志.resources/examples
order: 9000
