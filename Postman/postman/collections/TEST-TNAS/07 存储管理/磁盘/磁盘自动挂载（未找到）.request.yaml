$kind: http-request
url: "{{baseUrl}}/v1/:name?type&way&flag"
method: PUT
headers:
  Content-Type: application/x-www-form-urlencoded
queryParams:
  - key: type
    value: null
    description: 设备类型：0=USB, 1=硬盘，枚举值：0=USB，1=硬盘
  - key: way
    value: null
    description: 挂载方式：auto=自动，枚举值：auto=自动
  - key: flag
    value: null
    description: 标识：in=插入
pathVariables:
  - key: name
    value: ""
    description: 设备名称，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 49000
