$kind: http-example
name: 正常导出SMART信息（未识别到SMART信息，表数据为空）
request:
  url: "{{baseUrl}}/v2/disk/ExportOverview?device={{usb_nvme_device}}"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: device
      value: "{{usb_nvme_device}}"
      description: 设备路径，如/dev/sda，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
