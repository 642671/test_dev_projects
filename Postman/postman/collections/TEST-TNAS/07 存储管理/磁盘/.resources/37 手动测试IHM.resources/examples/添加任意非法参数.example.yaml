$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/ManualTest?device={{Ihm1_device}}&abc=123"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: device
      value: "{{Ihm1_device}}"
      description: 设备路径，如/dev/sda，必填参数需要询问用户给出
    - key: abc
      value: "123"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 14000
