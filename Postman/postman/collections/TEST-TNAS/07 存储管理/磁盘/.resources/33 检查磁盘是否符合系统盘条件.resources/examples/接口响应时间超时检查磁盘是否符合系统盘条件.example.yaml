$kind: http-example
name: 接口响应时间超时检查磁盘是否符合系统盘条件接口
request:
  url: "{{baseUrl}}/v2/disk/CheckSysDisk"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 13000
