$kind: http-example
name: 无权限用户访问检查磁盘是否符合系统盘条件接口
request:
  url: "{{baseUrl}}/v2/disk/CheckSysDisk"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 10000
