$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/DiskScan"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "device": "{{disk1_device}}",
          "status": "1"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 16000
