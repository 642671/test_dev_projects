$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/smart_test/schedule/:id/exec"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  pathVariables:
    - key: id
      value: ""
      description: 任务ID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 8000
