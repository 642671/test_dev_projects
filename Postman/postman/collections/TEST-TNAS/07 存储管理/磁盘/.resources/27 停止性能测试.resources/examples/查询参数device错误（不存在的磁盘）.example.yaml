$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/benchmark/stop?device=/dev/sdz"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    device: /dev/sdz
  body:
    type: json
    content: |-
      {
          "device": "{{disk1_device}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
