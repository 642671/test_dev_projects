$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/smart_test/schedule"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "name": "{{disk1_model}}",
          "serial": "{{disk1_serial}}",
          "test_type": 0,
          "disks": "{{disk1_device}}",
          "enabled": true,
          "exception_warn": true,
          "schedule": {
              "cycle_type": "EveryDay",
              "cycle_weeks_range": "",
              "cycle_date": "",
              "schedule_time": "",
              "frequency_type": "Disabled",
              "frequency_value": 0,
              "hour": 24,
              "minute": 0
          }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 40000
