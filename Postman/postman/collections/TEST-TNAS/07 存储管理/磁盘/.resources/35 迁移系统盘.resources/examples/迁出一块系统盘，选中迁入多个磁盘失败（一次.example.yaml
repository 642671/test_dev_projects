$kind: http-example
name: 迁出一块系统盘，选中迁入多个磁盘失败（一次只允许迁入一个）
request:
  url: "{{baseUrl}}/v2/disk/MigrateSysDisk"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{X-Curpass-Token}}"
  body:
    type: json
    content: |-
      {
          "src_sys_disks": ["{{disk1_device}}"],
          "dest_disk": "{{disk2_device}}:{{disk3_device}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 8000
