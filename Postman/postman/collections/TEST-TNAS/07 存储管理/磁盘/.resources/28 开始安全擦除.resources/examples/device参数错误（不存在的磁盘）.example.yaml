$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/sec_erase/start?device=/dev/sdz"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{X-Curpass-Token}}"
      description: 不可为空，密码认证所需token
  queryParams:
    - key: device
      value: /dev/sdz
      description: 设备路径，如/dev/sda
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 28000
