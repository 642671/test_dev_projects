$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/smart_test/schedule/:id/edit"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    - key: id
      value: "{{disk1_smart_id}}"
      description: 任务ID，必填参数需要询问用户给出
  body:
    type: json
    content: |-
      {
          "id": {{disk1_smart_id}},
          "name": "{{disk2_model}}",
          "serial": "{{disk1_serial}}",
          "status": 0,
          "test_range": 1,
          "test_type": 0,
          "disks": "{{disk1_device}}",
          "enabled": false,
          "exception_warn": true,
          "schedule": {
              "cycle_type": "Disabled",
              "cycle_weeks_range": "",
              "cycle_date": "",
              "schedule_time": "",
              "frequency_type": "Disabled",
              "frequency_value": 0,
              "hour": 0,
              "minute": 0
          }
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 34000
