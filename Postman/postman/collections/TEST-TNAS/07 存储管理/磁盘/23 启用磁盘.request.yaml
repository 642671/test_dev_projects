$kind: http-request
url: "{{baseUrl}}/v2/disk/activation/enable"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"disk\": \"{{disk1_device}}\"\r

    }"
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/23 启用磁盘.resources/examples
order: 23000
