$kind: http-request
url: "{{baseUrl}}/v2/disk/MountDisk/:name"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: name
    value: "{{cap_disk6}}"
    description: 硬盘名称，如sda1，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/20 挂载硬盘.resources/examples
order: 20000
