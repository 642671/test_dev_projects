$kind: http-request
url: "{{baseUrl}}/v1/notice/:name?type"
method: PUT
headers:
  Content-Type: application/x-www-form-urlencoded
queryParams:
  - key: type
    value: null
    description: 设备类型：0=USB, 1=硬盘，枚举值：0=USB，1=硬盘
pathVariables:
  - key: name
    value: ""
    description: 设备名称，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
order: 50000
