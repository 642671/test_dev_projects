$kind: http-request
url: "{{baseUrl}}/v2/extStorageDevice/EditUsbRemindConfig"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"device\": \"usb\",\r

    \    \"enable\": true,\r

    \    \"remind_ratio\": 0.5\r

    }"
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/03 编辑USB容量预警配置.resources/examples
order: 3000
