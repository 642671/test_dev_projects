$kind: http-example
request:
  url: "{{baseUrl}}/v2/extStorageDevice/DownloadSecretKey?data={{usb_key_data}}&abc=123"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: data
      value: "{{usb_key_data}}"
      description: Base64编码的密钥文件路径，由ObtainSecretKey接口返回，文本类型，必填参数需要询问用户给出
    - key: abc
      value: "123"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 6000
