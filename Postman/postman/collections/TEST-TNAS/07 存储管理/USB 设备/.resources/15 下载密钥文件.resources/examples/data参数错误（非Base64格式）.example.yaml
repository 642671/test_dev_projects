$kind: http-example
request:
  url: "{{baseUrl}}/v2/extStorageDevice/DownloadSecretKey?data=not-base64!!"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: data
      value: not-base64!!
      description: Base64编码的密钥文件路径，由ObtainSecretKey接口返回，文本类型，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
