$kind: http-example
request:
  url: "{{baseUrl}}/v2/extStorageDevice/Process?name={{usb1_name}}"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: name
      value: "{{usb1_name}}"
      description: 设备名称，文本类型，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
