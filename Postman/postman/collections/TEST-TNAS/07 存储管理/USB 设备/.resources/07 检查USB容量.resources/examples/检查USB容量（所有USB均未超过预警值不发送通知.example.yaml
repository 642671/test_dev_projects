$kind: http-example
name: 检查USB容量（所有USB均未超过预警值不发送通知）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/CheckUsbCapacity"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 2000
