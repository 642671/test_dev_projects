$kind: http-example
request:
  url: "{{baseUrl}}/v2/extStorageDevice/ObtainSecretKey"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: urlencoded
    content:
      pwd: Admin123
      path: "{{usb1_umnt_share}}"
      dev: "{{usb1_name}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
