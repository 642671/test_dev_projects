$kind: http-example
name: 正常获取NTFS格式USB设备的访问权限（默认权限为allusers）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/UsbAclAll"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "folder_names": [
              "{{usb1_s2}}"
          ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
