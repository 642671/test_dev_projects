$kind: http-request
url: "{{baseUrl}}/v2/extStorageDevice/UnmountDevice"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: formdata
  content:
    - type: text
      key: name
      value: sde3
      description: 要卸载的设备分区名称（如sdg、sdg1），必填参数需要询问用户给出
    - type: text
      key: type
      value: usb
      description: 设备类型，固定值：usb，非usb提示invalid type
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/13 卸载USB设备（安全移除）.resources/examples
order: 13000
