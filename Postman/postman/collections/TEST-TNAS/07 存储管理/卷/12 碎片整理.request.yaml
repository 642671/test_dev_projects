$kind: http-request
url: "{{baseUrl}}/v2/storage/defragment/:uuid"
method: GET
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: uuid
    value: "{{lv0_uuid}}"
    description: 卷UUID，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/12 碎片整理.resources/examples
order: 12000
