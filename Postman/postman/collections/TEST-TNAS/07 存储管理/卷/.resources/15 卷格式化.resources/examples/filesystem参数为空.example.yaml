$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/volumeFormatting"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-CurPass-Token
      value: "{{X-Curpass-Token}}"
      description: 不可为空，密码认证密文
  body:
    type: json
    content: |-
      {
          "mode": 1,
          "device": "{{cv_vg0_name}}",
          "filesystem": """",
          "pool_free_size": {{cv_vg0_free_gb}},
          "volume_size": 10,
          "description": "测试卷",
          "level": "",
          "disks": [],
          "hyper_lock_status": 0,
          "hyper_lock_day": 0,
          "hyper_lock_model": 0
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 8000
