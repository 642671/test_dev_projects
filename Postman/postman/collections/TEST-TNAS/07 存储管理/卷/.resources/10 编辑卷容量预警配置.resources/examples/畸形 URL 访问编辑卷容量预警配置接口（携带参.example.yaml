$kind: http-example
name: 畸形 URL 访问编辑卷容量预警配置接口（携带参数等错误）
request:
  url: "{{baseUrl}}/v2/storage/EditVolumeRemindConfig"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  body:
    type: json
    content: |-
      {
          "device": "volume",
          "enable": true,
          "remind_ratio": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 21000
