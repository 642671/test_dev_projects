$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/delete/volume/:uuid"
  method: DELETE
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{expired_Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{expired_X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-CurPass-Token
      value: "{{X-CurPass-Token}}"
      description: 不可为空，密码认证密文
  pathVariables:
    - key: uuid
      value: "{{lv0_uuid}}"
      description: 卷UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 25000
