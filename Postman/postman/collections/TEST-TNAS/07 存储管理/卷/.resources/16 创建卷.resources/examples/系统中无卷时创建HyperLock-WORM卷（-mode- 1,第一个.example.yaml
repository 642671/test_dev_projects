$kind: http-example
name: '系统中无卷时创建HyperLock-WORM卷（"mode": 1,第一个卷不能是HyperLock）'
request:
  url: "{{baseUrl}}/v2/storage/create/volume"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "mode": 1,
          "device": "{{cv_vg0_name}}",
          "filesystem": "HyperLock-worm",
          "pool_free_size": {{cv_vg0_free_gb}},
          "volume_size": 10,
          "description": "测试卷",
          "level": "",
          "disks": [],
          "hyper_lock_status": 1,
          "hyper_lock_day": 365,
          "hyper_lock_model": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 11000
