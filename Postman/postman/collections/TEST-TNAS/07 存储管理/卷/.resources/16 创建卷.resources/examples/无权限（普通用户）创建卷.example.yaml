$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/create/volume"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
          "mode": 1,
          "device": "{{cv_vg0_name}}",
          "filesystem": "btrfs",
          "pool_free_size": {{cv_vg0_free_gb}},
          "volume_size": 10,
          "description": "测试卷",
          "level": "",
          "disks": [],
          "hyper_lock_status": 0,
          "hyper_lock_day": 0,
          "hyper_lock_model": 0
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 44000
