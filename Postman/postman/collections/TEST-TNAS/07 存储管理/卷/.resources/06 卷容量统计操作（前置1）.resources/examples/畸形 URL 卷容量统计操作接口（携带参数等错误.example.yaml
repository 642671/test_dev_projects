$kind: http-example
name: 畸形 URL 卷容量统计操作接口（携带参数等错误）
request:
  url: "{{baseUrl}}/v2/storage/volumeOccupyAction"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  body:
    type: json
    content: |-
      {
          "uuid": "{{lv0_uuid}}",
          "action": "start"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 19000
