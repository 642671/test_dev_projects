$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/edit/volume/:uuid"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    uuid: "{{lv0_uuid}}"
  body:
    type: json
    content: |-
      {
          "description": " ",
          "capacity": 100,
          "quota_flag": 
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 20000
