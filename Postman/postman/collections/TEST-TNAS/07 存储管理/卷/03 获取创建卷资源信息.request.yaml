$kind: http-request
url: "{{baseUrl}}/v2/storage/create/volume"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
scripts:
  - type: afterResponse
    code: "// ============================================================\r

      // GET /v2/storage/create/volume 后置脚本\r

      // 解析返回 → 写入模块变量 → 供后续 POST 创建卷使用\r

      // ------------------------------------------------------------\r

      // 遵循 POSTMAN_SCRIPT_STANDARDS.md 中的强制规范：\r

      //   1. 每次执行必须先清理旧的同前缀变量\r

      //   2. 有值就 set，没值就 unset，不允许残留空字符串或 0\r

      //   3. 变量按业务字段命名，不依赖数组下标\r

      // ============================================================\r

      \r

      const res = pm.response.json();\r

      const data = res.data || res;\r

      \r

      // ------------------------------------------------------------\r

      // 小工具：有值就 set，否则 unset，避免残留空变量\r

      // ------------------------------------------------------------\r

      function setOrUnset(key, val) {\r

      \    if (val === undefined || val === null || val === '' || Number.isNaN(val)) {\r

      \        pm.collectionVariables.unset(key);\r

      \    } else {\r

      \        pm.collectionVariables.set(key, val);\r

      \    }\r

      }\r

      \r

      // ============================================================\r

      // 0. 清理所有旧的 cv_ 变量（动态扫描，防止残留）\r

      // ============================================================\r

      const allModuleVars = pm.collectionVariables.toObject();\r

      Object.keys(allModuleVars)\r

      \    .filter(k => k.startsWith('cv_'))\r

      \    .forEach(k => pm.collectionVariables.unset(k));\r

      \r

      // ============================================================\r

      // 1. 响应合法性校验\r

      // ============================================================\r

      pm.test('响应结构正确', () => {\r

      \    pm.expect(res).to.be.an('object');\r

      \    pm.expect(data).to.have.property('free_disk');\r

      \    pm.expect(data).to.have.property('free_pool');\r

      \    pm.expect(data).to.have.property('hype_lock');\r

      \    pm.expect(data.free_disk).to.be.an('array');\r

      \    pm.expect(data.free_pool).to.be.an('array');\r

      });\r

      \r

      // ============================================================\r

      // 2. 空闲磁盘列表 → 提取 name 和设备路径\r

      // ============================================================\r

      const freeDisks = (data.free_disk || []).map(d => ({\r

      \    label: `${d.name}(${d.device || ''})`,   // 下拉框显示：HDD6(/dev/sdf)\r

      \    value: (d.device || '').trim(),           // 实际值：/dev/sdf（.trim 防 %20）\r

      \    name:  (d.name  || '').trim(),            // 名称：HDD6\r

      \    capacity: d.capacity || '',               // 容量：1.00 TB\r

      \    type: d.type || '',                       // 类型：normal/ssd/nvme\r

      \    status: d.status || '',                   // 状态\r

      }));\r

      \r

      // 磁盘列表本身如果为空数组，也不写入（严格遵守\"没值就 unset\"）\r

      if (freeDisks.length > 0) {\r

      \    pm.collectionVariables.set('cv_disk_list', JSON.stringify(freeDisks));\r

      }\r

      \r

      // 前 3 块空闲磁盘的路径 / 名称，供 POST 创建卷时选用\r

      // 有几个写几个，没有就 unset\r

      setOrUnset('cv_disk_0_path', freeDisks[0]?.value);\r

      setOrUnset('cv_disk_0_name', freeDisks[0]?.name);\r

      setOrUnset('cv_disk_1_path', freeDisks[1]?.value);\r

      setOrUnset('cv_disk_1_name', freeDisks[1]?.name);\r

      setOrUnset('cv_disk_2_path', freeDisks[2]?.value);\r

      setOrUnset('cv_disk_2_name', freeDisks[2]?.name);\r

      \r

      // ============================================================\r

      // 3. 每个存储池按实际名称生成独立变量\r

      // ============================================================\r

      const freePools = (data.free_pool || []).map(p => ({\r

      \    label: `${p.name}(${(p.free?.value || 0).toFixed(0)}${p.free?.unit || 'KB'}可用)`,\r

      \    value: (p.name || '').trim(),\r

      \    uuid: p.uuid || '',\r

      \    free: p.free?.value || 0,\r

      \    unit: p.free?.unit || 'KB',\r

      \    total: p.total?.value || 0,\r

      \    level: p.level || '',\r

      \    lv_count: p.lv_count || 0,\r

      }));\r

      \r

      if (freePools.length > 0) {\r

      \    pm.collectionVariables.set('cv_pool_list', JSON.stringify(freePools));\r

      }\r

      \r

      // 按实际池名生成变量，如 cv_vg0_name、cv_vg2_free_gb\r

      // 不管池编号是否连续（vg0、vg2、vg5），都能准确对应\r

      freePools.forEach(p => {\r

      \    const poolName = p.value;                             // 如 \"vg0\"\r

      \    if (!poolName) return;                                // 池名空则跳过\r

      \    pm.collectionVariables.set(`cv_${poolName}_name`,    poolName);\r

      \    pm.collectionVariables.set(`cv_${poolName}_free_kb`, p.free);\r

      \    pm.collectionVariables.set(`cv_${poolName}_free_gb`, Math.floor(p.free / 1024 / 1024));\r

      });\r

      \r

      // 选中池默认取第一个（POST 的 device 和 pool_free_size 用这个）\r

      // 没有可用池就 unset，绝不留空字符串\r

      if (freePools.length > 0) {\r

      \    setOrUnset('cv_selected_pool_name',    freePools[0].value);\r

      \    setOrUnset('cv_selected_pool_free_gb', Math.floor(freePools[0].free / 1024 / 1024));\r

      } else {\r

      \    pm.collectionVariables.unset('cv_selected_pool_name');\r

      \    pm.collectionVariables.unset('cv_selected_pool_free_gb');\r

      }\r

      \r

      // ============================================================\r

      // 4. 自动生成的存储池名（mode=0 新池时用）\r

      // ============================================================\r

      const poolInfo = data.pool_info || {};\r

      setOrUnset('cv_new_pool_name', poolInfo.show_name || poolInfo.uuid);\r

      setOrUnset('cv_new_pool_sort', poolInfo.sort);\r

      \r

      // ============================================================\r

      // 5. 自动生成的卷名（前端回显用, 实际创建时不需要）\r

      // ============================================================\r

      setOrUnset('cv_new_volume_sort', data.volume_info1?.sort || data.volume_info2?.sort);\r

      \r

      // ============================================================\r

      // 6. 是否支持 xfs 文件系统\r

      // hype_lock = true  → 系统中还没有 xfs 卷，可以创建 xfs\r

      // hype_lock = false → 已有 xfs 卷，不能再选 xfs\r

      // ============================================================\r

      const xfsAvailable = !!data.hype_lock;\r

      pm.collectionVariables.set('cv_xfs_available', xfsAvailable);   // 布尔值本身有意义，直接 set\r

      const fsOptions = ['btrfs', 'ext4'];\r

      if (xfsAvailable) fsOptions.push('xfs');\r

      pm.collectionVariables.set('cv_fs_options', JSON.stringify(fsOptions));\r

      pm.collectionVariables.set('cv_filesystem', 'btrfs');\r

      \r

      // ============================================================\r

      // 7. 调试输出\r

      // ============================================================\r

      console.log('==== 创建卷资源一览 ====');\r

      console.log(`空闲磁盘: ${freeDisks.length} 块 → ${freeDisks.map(d => d.label).join(', ') || '无'}`);\r

      console.log(`可选存储池: ${freePools.length} 个 → ${freePools.map(p => p.label).join(', ') || '无'}`);\r

      freePools.forEach(p => {\r

      \    console.log(`  cv_${p.value}_name=${p.value}, 剩余=${Math.floor(p.free/1024/1024)}GB`);\r

      });\r

      console.log(`选中池: cv_selected_pool_name=${pm.collectionVariables.get('cv_selected_pool_name') || '(未设置)'}`);\r

      console.log(`自动池名: ${poolInfo.show_name || '(未返回)'}`);\r

      console.log(`xfs 可用: ${xfsAvailable}`);\r

      console.log(`文件系统选项: ${fsOptions.join('/')}`);\r\n"
    language: text/javascript
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/03 获取创建卷资源信息.resources/examples
order: 3000
