$kind: http-example
name: 选中磁盘容量小于阵列修复要求的最小容量修复失败
request:
  url: "{{baseUrl}}/v2/lvmCache/FixLvmCache"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{X-Curpass-Token}}"
  body:
    type: json
    content: |-
      {
          "disk_list": [
              "{{small_disk}}"
          ],
          "md_uuid": "{{hc_md5_uuid}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 6000
