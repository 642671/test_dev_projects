$kind: http-example
name: 正常创建single盘缓存（raid_level=1选中一块磁盘，writeback回写）
request:
  url: "{{baseUrl}}/v2/lvmCache/CreateCacheLv"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{X-Curpass-Token}}"
  body:
    type: json
    content: |-
      {
          "raid_level": 1,
          "cache_mode": "writeback",
          "cache_size": "74G",
          "main_lv": "{{hc_lv_path}}",
          "fast_devices": [
              "{{hc_cand_ssd}}"
          ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
