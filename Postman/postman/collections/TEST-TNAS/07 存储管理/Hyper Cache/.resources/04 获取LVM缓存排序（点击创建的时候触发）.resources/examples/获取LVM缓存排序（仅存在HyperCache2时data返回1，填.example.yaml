$kind: http-example
name: 获取LVM缓存排序（仅存在HyperCache2时data返回1，填空隙）
request:
  url: "{{baseUrl}}/v2/lvmCache/GetLvmCacheSort"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
