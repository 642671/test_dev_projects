$kind: http-example
request:
  url: "{{baseUrl}}/v2/lvmCache/DeleteCacheLv"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{wrong_X-Curpass-Token}}"
      description: 不可为空，密码认证所需token
  body:
    type: json
    content: |-
      {
          "lv_uuid": "{{hc1_uuid}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 7000
