$kind: http-example
name: 获取空闲SSD列表（SMART状态为警告和错误的SSD正常展示）
request:
  url: "{{baseUrl}}/v2/lvmCache/FreeSSDs"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 4000
