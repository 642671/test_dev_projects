$kind: http-example
name: 不允许多重连接且已被其他主机连接的Target登录失败
request:
  url: "{{baseUrl}}/v2/virtualdisk/IscsiLogin"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "targetName": "{{iscsi_single_target}}",
          "ip": "10.18.15.161",
          "port": "3260",
          "head": "0",
          "data": "0",
          "status": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 8000
