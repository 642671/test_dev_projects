$kind: http-example
name: 正常登录有密码的虚拟磁盘（status=true带CHAP账号密码）
request:
  url: "{{baseUrl}}/v2/virtualdisk/IscsiLogin"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "targetName": "iqn.tnas.terramaster.26719092407",
          "ip": "10.18.15.161",
          "port": "3260",
          "head": "0",
          "data": "0",
          "status": true,
          "username": "chapuser",
          "password": "chappass123"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
