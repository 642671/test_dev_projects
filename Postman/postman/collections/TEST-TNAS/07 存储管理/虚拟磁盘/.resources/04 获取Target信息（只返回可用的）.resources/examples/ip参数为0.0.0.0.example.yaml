$kind: http-example
request:
  url: "{{baseUrl}}/v2/virtualdisk/GetTargetInfo?ip=0.0.0.0&port=3260"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: ip
      value: 0.0.0.0
      description: iSCSI服务端IP地址，文本类型，必填参数需要询问用户给出
    - key: port
      value: "3260"
      description: iSCSI服务端端口，数值文本，1-65535，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 24000
