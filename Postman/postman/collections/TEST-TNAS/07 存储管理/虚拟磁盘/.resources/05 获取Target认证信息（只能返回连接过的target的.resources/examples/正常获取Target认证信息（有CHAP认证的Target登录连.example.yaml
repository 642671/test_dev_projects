$kind: http-example
name: 正常获取Target认证信息（有CHAP认证的Target登录连接后获取）
request:
  url: "{{baseUrl}}/v2/virtualdisk/GetTargetAttr"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    target: iqn.tnas.terramaster.26719092407
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 14000
