$kind: http-request
url: "{{baseUrl}}/v2/storage/StorageDescription/:uuid"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: uuid
    value: "{{vg0_uuid}}"
    description: 存储池UUID，必填参数需要询问用户给出
body:
  type: json
  content: "{\r

    \    \"description\": \"编辑存储池描述\"\r

    }"
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/13 编辑存储池描述.resources/examples
order: 13000
