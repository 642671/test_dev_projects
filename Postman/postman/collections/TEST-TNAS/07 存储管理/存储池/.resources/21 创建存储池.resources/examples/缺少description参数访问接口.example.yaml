$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/create/pool"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: '{"name":"test_pool","level":"raid5","disks":["sdb","sdc","sdd"],"raid":"md0","spare_disks":[],"force":false}'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 74000
