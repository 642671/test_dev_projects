$kind: http-example
name: 选中多块磁盘分别在NAS中与USB中创建存储池失败（混用外接盘）
request:
  url: "{{baseUrl}}/v2/storage/create/pool"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "level": "raid1",
          "disks": ["{{cp_disk_0_path}}", "{{cp_disk_1_path}}"]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 27000
