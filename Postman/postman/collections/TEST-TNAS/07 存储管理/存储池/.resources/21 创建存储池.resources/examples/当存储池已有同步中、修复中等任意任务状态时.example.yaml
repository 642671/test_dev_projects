$kind: http-example
name: 当存储池已有同步中、修复中等任意任务状态时创建存储池失败
request:
  url: "{{baseUrl}}/v2/storage/create/pool"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "level": "single",
          "disks": ["{{cp_disk_0_path}}"]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 50000
