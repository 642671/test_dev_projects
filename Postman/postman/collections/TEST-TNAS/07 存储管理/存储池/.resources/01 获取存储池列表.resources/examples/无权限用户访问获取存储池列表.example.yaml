$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/list/storagePool?type=detail"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  queryParams:
    - key: type
      value: detail
      description: 信息类型：detail=详细信息, brief=简要信息
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 11000
