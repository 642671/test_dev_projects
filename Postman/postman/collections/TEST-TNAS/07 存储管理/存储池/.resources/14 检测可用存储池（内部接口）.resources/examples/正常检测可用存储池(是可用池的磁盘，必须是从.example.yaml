$kind: http-example
name: 正常检测可用存储池(是可用池的磁盘，必须是从别的NAS拆下来的，否则识别不到)
request:
  url: "{{baseUrl}}/v2/storage/CheckAvailablePool/:disk"
  method: POST
  headers:
    Content-Type: application/json
    Cookie: "{{Cookie}}"
    X-Csrf-Token: "{{X-Csrf-Token}}"
    "{{X-Csrf-Token}}": "{{X-Csrf-Token}}"
  pathVariables:
    - key: disk
      value: "{{cap_disk0}}"
      description: 磁盘名称，如sda，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 6000
