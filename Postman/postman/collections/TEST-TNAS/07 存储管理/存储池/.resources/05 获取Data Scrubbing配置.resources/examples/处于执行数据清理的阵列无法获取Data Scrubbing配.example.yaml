$kind: http-example
name: 处于执行数据清理的阵列无法获取Data Scrubbing配置
request:
  url: "{{baseUrl}}/v2/storage/GetDataScrubbingConf?raid={{vg0_raid}}"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: raid
      value: "{{vg0_raid}}"
      description: RAID设备名，如md0，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
