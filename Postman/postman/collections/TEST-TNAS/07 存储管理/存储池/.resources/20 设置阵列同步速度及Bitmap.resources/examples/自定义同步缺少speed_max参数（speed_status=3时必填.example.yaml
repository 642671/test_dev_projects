$kind: http-example
name: 自定义同步缺少speed_max参数（speed_status=3时必填）
request:
  url: "{{baseUrl}}/v2/storage/SetRaidSpeedOrBitmap"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "raid": "/dev/md0",
          "speed_status": 3,
          "speed_min": 100,
          "bitmap_status": true
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 6000
