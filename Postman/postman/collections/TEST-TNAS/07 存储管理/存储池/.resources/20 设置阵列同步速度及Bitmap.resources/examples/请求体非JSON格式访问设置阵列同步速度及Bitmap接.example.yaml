$kind: http-example
name: 请求体非JSON格式访问设置阵列同步速度及Bitmap接口
request:
  url: "{{baseUrl}}/v2/storage/SetRaidSpeedOrBitmap"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: text
    content: 这不是一个JSON字符串
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 19000
