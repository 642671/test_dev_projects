$kind: http-example
name: 正常自定义同步（speed_status=3，指定speed_min/speed_max）
request:
  url: "{{baseUrl}}/v2/storage/SetRaidSpeedOrBitmap"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "raid": "/dev/md0",
          "speed_status": 3,
          "speed_min": 100,
          "speed_max": 500,
          "bitmap_status": true
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 13000
