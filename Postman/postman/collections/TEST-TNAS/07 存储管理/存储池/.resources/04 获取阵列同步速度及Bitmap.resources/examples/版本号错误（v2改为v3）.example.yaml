$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/GetRaidSpeedOrBitmap?raid={{vg0_raid}}"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  queryParams:
    - key: raid
      value: "{{vg0_raid}}"
      description: RAID设备路径，如/dev/md0，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 20000
