$kind: http-example
name: 畸形 URL 获取存储池信息接口（携带参数等错误）
request:
  url: "{{baseUrl}}/v2/storage/edit/pool/:uuid"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  pathVariables:
    - key: uuid
      value: "{{vg0_uuid}}"
      description: 存储池UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 15000
