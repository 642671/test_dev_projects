$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/EnableQuota"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: '{"uuid":12345,"file_system":"btrfs","quota_flag":1}'
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 17000
