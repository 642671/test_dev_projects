$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/EnableQuota"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
          "uuid":"{{lv0_uuid}}",
          "file_system": "{{lv0_filesystem}}",
          "quota_flag": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 11000
