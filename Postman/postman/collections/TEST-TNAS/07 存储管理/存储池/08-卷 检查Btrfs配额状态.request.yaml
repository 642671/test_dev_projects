$kind: http-request
url: "{{baseUrl}}/v2/storage/CheckQuota?mntPath={{lv0_mnt_path}}"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: mntPath
    value: "{{lv0_mnt_path}}"
    description: 挂载路径，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/08-卷 检查Btrfs配额状态.resources/examples
order: 8000
