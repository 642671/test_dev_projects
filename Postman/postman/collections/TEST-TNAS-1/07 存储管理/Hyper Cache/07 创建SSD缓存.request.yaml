$kind: http-request
url: "{{baseUrl}}/v2/lvmCache/CreateCacheLv"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"raid_level\": 1,\r

    \    \"cache_mode\": \"writethrough\",\r

    \    \"cache_size\": \"74G\",\r

    \    \"main_lv\": \"/dev/mapper/vg1-lv0\",\r

    \    \"fast_devices\": [\r

    \        \"/dev/sdzd\"\r

    \    ]\r

    }"
order: 7000
