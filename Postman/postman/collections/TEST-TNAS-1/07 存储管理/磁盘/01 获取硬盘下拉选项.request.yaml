$kind: http-request
url: "{{baseUrl}}/v2/disk/GetDiskOption"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
scripts:
  - type: afterResponse
    code: |-
      /**
       * ==========================================================
       * 功能：同步磁盘设备名到模块变量
       * ==========================================================
       *
       * 【脚本目的】
       * 获取当前系统所有磁盘设备名，自动生成模块变量：
       *
       *      cap_disk0
       *      cap_disk1
       *      cap_disk2
       *      ...
       *
       * 后续接口可直接使用：
       *
       *      /v2/storage/CheckAvailablePool/{{cap_disk0}}
       *      /v2/storage/CheckAvailablePool/{{cap_disk1}}
       *      /v2/storage/CheckAvailablePool/{{cap_disk2}}
       *
       * 命名说明：
       *
       *      cap_ = CheckAvailablePool 接口专用前缀
       *
       * ==========================================================
       * 为什么每次都要同步？
       * ==========================================================
       *
       * 磁盘是动态变化的，例如：
       *
       * 第一次：
       *      sda
       *      sdb
       *      sdc
       *
       * 后来：
       *      拔掉 sdb
       *      插入 sdd
       *
       * 如果仍然使用旧变量：
       *
       *      cap_disk0  = sda   √
       *      cap_disk1  = sdb   × 已不存在
       *      cap_disk2  = sdc   × 序号已变
       *
       * 因此，本脚本属于【同步脚本】
       *
       * 每次执行：
       *
       * ① 删除历史磁盘变量
       * ② 获取当前最新磁盘列表
       * ③ 重新生成磁盘变量
       *
       * 保证：
       *
       *      模块变量 == 当前系统真实磁盘
       *
       * ==========================================================
       */


      // ==========================================================
      // 1、获取接口响应
      // ==========================================================
      const res = pm.response.json();


      // ==========================================================
      // 2、接口没有返回 data，结束脚本
      // ==========================================================
      if (!res.data) {

          console.log("响应 data 为空，停止生成磁盘变量。");

          return;
      }


      // ==========================================================
      // 3、将 data 作为数组
      //
      // data:
      //
      // [
      //      { "name": "HDD1",   "device": "/dev/sda"  },
      //      { "name": "HDD2",   "device": "/dev/sdb"  },
      //      { "name": "NVMe1",  "device": "/dev/sdza" }
      // ]
      //
      // 提取 device 中 /dev/ 后面的部分作为磁盘名。
      // ==========================================================

      const disks = res.data.map(d => d.device.replace(/^\/dev\//, ''));


      // ==========================================================
      // 4、清理历史模块变量
      //
      // 防止磁盘变化后变量残留。
      //
      // 例如：
      //
      // 上一次:
      //
      // cap_disk0
      // cap_disk1
      // cap_disk2
      //
      //
      // 本次:
      //
      // 只有两个磁盘
      //
      //
      // 如果不清理:
      //
      // cap_disk2
      //
      // 仍保存旧设备名
      //
      // ==========================================================

      for (let i = 0; i < 50; i++) {

          pm.collectionVariables.unset(`cap_disk${i}`);

      }


      // ==========================================================
      // 5、重新生成模块变量
      //
      // 生成:
      //
      // cap_disk0 = sda
      // cap_disk1 = sdb
      // cap_disk2 = sdc
      // ...
      //
      // 用于接口:
      //
      // /v2/storage/CheckAvailablePool/{{cap_disk0}}
      // /v2/storage/CheckAvailablePool/{{cap_disk1}}
      // /v2/storage/CheckAvailablePool/{{cap_disk2}}
      // ==========================================================

      disks.forEach((disk, index) => {

          const variableName = `cap_disk${index}`;

          pm.collectionVariables.set(
              variableName,
              disk
          );

          console.log(
              `${variableName} = ${disk}`
          );

      });


      // ==========================================================
      // 6、保存磁盘数量
      //
      // 方便后续接口循环使用。
      // ==========================================================

      pm.collectionVariables.set(
          "cap_disk_count",
          disks.length
      );


      // ==========================================================
      // 7、输出日志
      // ==========================================================

      console.log("====================================");
      console.log(`共发现 ${disks.length} 个磁盘`);
      console.log("所有磁盘设备名已同步到模块变量。");
      console.log("====================================");

      // ============================================================
      // GET /v2/disk/list 后置脚本（示例路径，请按实际接口路径调整注释）
      // 解析返回 → 写入模块变量 → 供后续接口引用磁盘路径
      // ------------------------------------------------------------
      // 遵循 POSTMAN_SCRIPT_STANDARDS.md 中的强制规范：
      //   1. 每次执行必须先清理旧的同前缀变量
      //   2. 有值就 set，没值就 unset，不允许残留空字符串或 0
      //   3. 磁盘变量按索引命名：disk1_device / disk1_name（索引从 1 起）
      // ============================================================

      const res = pm.response.json();
      const data = res.data || res;       // 此接口 data 直接是数组

      // ------------------------------------------------------------
      // 小工具：有值就 set，否则 unset，避免残留空变量
      // ------------------------------------------------------------
      function setOrUnset(key, val) {
          if (val === undefined || val === null || val === '' || Number.isNaN(val)) {
              pm.collectionVariables.unset(key);
          } else {
              pm.collectionVariables.set(key, val);
          }
      }

      // ============================================================
      // 0. 清理所有旧的 diskN_ 变量（动态扫描，防止残留）
      //    匹配 disk1_device / disk2_name / disk12_device 等
      // ============================================================
      const allModuleVars = pm.collectionVariables.toObject();
      Object.keys(allModuleVars)
          .filter(k => /^disk\d+_/.test(k))
          .forEach(k => pm.collectionVariables.unset(k));

      // ============================================================
      // 1. 响应合法性校验
      // ============================================================
      pm.test('响应结构正确（data 为数组）', () => {
          pm.expect(data).to.be.an('array');
      });

      pm.test('至少存在一个磁盘', () => {
          pm.expect(data.length).to.be.above(0);
      });

      pm.test('每个磁盘元素包含 name 和 device', () => {
          data.forEach(item => {
              pm.expect(item).to.have.property('name');
              pm.expect(item).to.have.property('device');
          });
      });

      // ============================================================
      // 2. 提取磁盘列表 → 按索引 1 起生成 diskN_device / diskN_name
      // ============================================================
      const disks = (data || []).map(d => ({
          name:   (d.name   || '').trim(),
          device: (d.device || '').trim(),
      }));

      // 汇总变量
      if (disks.length > 0) {
          pm.collectionVariables.set('disk_count', disks.length);
          pm.collectionVariables.set('disk_list', JSON.stringify(disks));
      }

      // 按索引为每一块磁盘生成独立变量（索引从 1 起）
      disks.forEach((d, i) => {
          const idx = i + 1;                              // 索引 1 起
          setOrUnset(`disk${idx}_device`, d.device);      // disk1_device = /dev/sda
          setOrUnset(`disk${idx}`,   d.name);        // disk1_name   = HDD3
      });

      // ============================================================
      // 3. 调试输出
      // ============================================================
      console.log('==== 磁盘列表资源一览 ====');
      console.log(`磁盘总数: ${disks.length} 块`);
      disks.forEach((d, i) => {
          console.log(`  disk${i + 1}_device=${d.device}, disk${i + 1}=${d.name}`);
      });
    language: text/javascript
order: 1000
