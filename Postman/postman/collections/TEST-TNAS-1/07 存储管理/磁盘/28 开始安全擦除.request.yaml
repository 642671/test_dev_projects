$kind: http-request
url: "{{baseUrl}}/v2/disk/sec_erase/start?device={{disk1_device}}"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
  - key: X-Curpass-Token
    value: "{{X-Curpass-Token}}"
    description: 不可为空，密码认证所需token
queryParams:
  device: "{{disk1_device}}"
order: 28000
