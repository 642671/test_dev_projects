$kind: http-request
url: "{{baseUrl}}/v2/hotsparedisk/DelHotSpare"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"devices\": [\r

    \        \"{{hsp1_device}}\"\r

    \    ]\r

    }"
order: 4000
