$kind: http-request
url: "{{baseUrl}}/v2/hotsparedisk/CreateHotSpareDisk"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: json
  content: "{\r

    \    \"devices\": [\r

    \        \"{{hs1_device}}\"\r

    \    ],\r

    \    \"raids\": [\r

    \        \"{{hs1_vg}}\"\r

    \    ]\r

    }"
order: 3000
