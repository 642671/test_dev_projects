$kind: http-request
url: "{{baseUrl}}/v2/virtualdisk/ClientLunRemove"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: formdata
  content:
    - type: text
      key: target
      value: ""
      description: Target IQN名称，必填参数需要询问用户给出
    - type: text
      key: lunid
      value: ""
      description: 要卸载的LUN编号，必填参数需要询问用户给出
order: 10000
