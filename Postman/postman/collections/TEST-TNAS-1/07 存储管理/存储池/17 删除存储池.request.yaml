$kind: http-request
url: "{{baseUrl}}/v2/storage/delete/pool/:uuid"
method: DELETE
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
  - key: X-CurPass-Token
    value: "{{X-Curpass-Token}}"
    description: 不可为空，密码认证密文
pathVariables:
  uuid: "{{vg1_uuid}}"
body:
  type: formdata
  content: []
order: 17000
