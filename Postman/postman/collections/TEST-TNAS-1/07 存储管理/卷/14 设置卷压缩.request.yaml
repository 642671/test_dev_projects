$kind: http-request
url: "{{baseUrl}}/v2/storage/compression/:uuid"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  uuid: "{{lv0_uuid}}"
body:
  type: json
  content: "{\r

    \    \"compressionStatus\": 0,\r

    \    \"compressionLevel\": 99\r

    }"
order: 14000
