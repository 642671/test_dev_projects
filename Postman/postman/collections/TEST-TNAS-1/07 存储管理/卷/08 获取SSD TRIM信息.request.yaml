$kind: http-request
url: "{{baseUrl}}/v2/storage/ssd/trim/:uuid"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  uuid: "{{lv6_uuid}}"
order: 8000
