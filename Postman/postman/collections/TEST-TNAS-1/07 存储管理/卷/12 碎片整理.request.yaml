$kind: http-request
url: "{{baseUrl}}/v2/storage/defragment/:uuid"
method: GET
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  uuid: "{{lv0_uuid}}"
order: 12000
