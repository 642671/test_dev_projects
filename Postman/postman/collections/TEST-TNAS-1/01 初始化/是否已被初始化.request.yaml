$kind: http-request
url: "{{baseUrl}}/v2/Initialise/IsInitialise"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // ============================================================
      // 变量清理脚本
      // 位置：初始化接口的【前置操作 / Pre-request Script】
      // 作用：每次执行前，清空运行期动态变量 + 全部模块变量
      // ============================================================

      // 【1】需要保留的静态环境变量白名单
      //     —— 当前为空，仅放一条占位示例（不是真实变量，不会匹配任何东西）
      //     —— 以后要保护某个变量时，把它的真实变量名加进来即可
      var KEEP_ENV_KEYS = [
          '__示例_这不是真实变量名_加真实变量时替换我__'
      ];

      // 【2】清理环境变量：删除白名单之外的所有变量
      try {
          var envObj = pm.environment.toObject();
          Object.keys(envObj).forEach(function (key) {
              if (KEEP_ENV_KEYS.indexOf(key) === -1) {
                  pm.environment.unset(key);
                  console.log('[清理] 环境变量已删除: ' + key);
              }
          });
      } catch (e) {
          console.log('[清理] 环境变量处理异常: ' + e.message);
      }

      // 【3】清空全部模块变量（Apifox 模块变量，全部为运行期派生变量）
      try {
          if (pm.collectionVariables && typeof pm.collectionVariables.toObject === 'function') {
              var modObj = pm.collectionVariables.toObject();
              Object.keys(modObj).forEach(function (key) {
                  pm.collectionVariables.unset(key);
                  console.log('[清理] 模块变量已删除: ' + key);
              });
          } else if (pm.collectionVariables && typeof pm.collectionVariables.clear === 'function') {
              pm.collectionVariables.clear();
              console.log('[清理] 模块变量已全部清空');
          }
      } catch (e) {
          console.log('[清理] 模块变量处理异常: ' + e.message);
      }

      // 【4】清空临时变量 / 集合变量
      try { pm.variables.clear(); } catch (e) {}
      try { pm.collectionVariables.clear(); } catch (e) {}

      // 【5】全局变量：若全局里存了凭证，请【勿】打开下一行
      // try { pm.globals.clear(); } catch (e) {}

      // 【6】（可选）清空 Cookie Jar —— 仅当开启了「自动管理 Cookie」时才需要
      // try {
      //     var jar = pm.cookies.jar();
      //     jar.clear('http://10.18.15.141:8181', function () {
      //         console.log('[清理] Cookie Jar 已清空');
      //     });
      // } catch (e) {}

      console.log('===== 变量清理完成 =====');
    language: text/javascript
order: 1000
