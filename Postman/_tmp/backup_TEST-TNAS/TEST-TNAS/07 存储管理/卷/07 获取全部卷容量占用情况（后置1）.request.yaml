$kind: http-request
url: "{{baseUrl}}/v2/storage/volumeOccupyStatusAll?uuid"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: uuid
    value: null
    description: 卷UUID，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/07 获取全部卷容量占用情况（后置1）.resources/examples
order: 7000
