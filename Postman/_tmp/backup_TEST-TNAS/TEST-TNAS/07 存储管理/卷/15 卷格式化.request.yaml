$kind: http-request
url: "{{baseUrl}}/v2/storage/volumeFormatting"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
  - key: X-CurPass-Token
    value: "{{X-Curpass-Token}}"
    description: 不可为空，密码认证密文
body:
  type: json
  content: "{\r

    \    \"uuid\": \"{{lv1_uuid}}\",\r

    \    \"filesystem\": \"ext4\"\r

    }"
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/15 卷格式化.resources/examples
order: 15000
