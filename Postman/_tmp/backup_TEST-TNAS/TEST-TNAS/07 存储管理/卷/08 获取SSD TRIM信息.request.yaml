$kind: http-request
url: "{{baseUrl}}/v2/storage/ssd/trim/:uuid"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: uuid
    value: "{{lv6_uuid}}"
    description: 卷UUID，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/08 获取SSD TRIM信息.resources/examples
order: 8000
