$kind: http-example
name: '系统中无卷时创建HyperLock-WORM卷（ "mode": 0,第一个卷不能是HyperLock）'
request:
  url: "{{baseUrl}}/v2/storage/create/volume"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 14000
