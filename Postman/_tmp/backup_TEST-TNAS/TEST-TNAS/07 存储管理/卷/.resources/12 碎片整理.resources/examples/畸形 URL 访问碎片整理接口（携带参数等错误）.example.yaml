$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/defragment/:uuid"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  pathVariables:
    - key: uuid
      value: "{{lv0_uuid}}"
      description: 卷UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 24000
