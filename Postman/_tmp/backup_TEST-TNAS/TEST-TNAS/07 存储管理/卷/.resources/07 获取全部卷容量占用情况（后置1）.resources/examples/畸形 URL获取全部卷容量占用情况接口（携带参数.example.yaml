$kind: http-example
name: 畸形 URL获取全部卷容量占用情况接口（携带参数等错误）
request:
  url: "{{baseUrl}}/v2/storage/volumeOccupyStatusAll?uuid={{lv0_uuid}}"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
  queryParams:
    - key: uuid
      value: "{{lv0_uuid}}"
      description: 卷UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 13000
