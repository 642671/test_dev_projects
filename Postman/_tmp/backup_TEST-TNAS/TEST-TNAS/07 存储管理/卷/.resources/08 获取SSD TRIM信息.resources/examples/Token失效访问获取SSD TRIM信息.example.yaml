$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/ssd/trim/:uuid"
  method: GET
  headers:
    - key: X-Csrf-Token
      value: "{{expired_X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{expired_Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  pathVariables:
    - key: uuid
      value: "{{lv0_uuid}}"
      description: 卷UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 9000
