$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/edit/volume/:uuid"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    uuid: "{{lv0_uuid}}"
  body:
    type: json
    content: |-
      {
          "description": "执行编辑卷",
          "capacity": 10.55,
          "quota_flag": 1
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
