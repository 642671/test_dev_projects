$kind: http-request
url: "{{baseUrl}}/v2/storage/GetDataScrubbingConf?raid={{vg2_raid}}"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: raid
    value: "{{vg2_raid}}"
    description: RAID设备名，如md0，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/05 获取Data Scrubbing配置.resources/examples
order: 5000
