$kind: http-request
url: "{{baseUrl}}/v2/storage/MountPool/:role/:uuid"
method: GET
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: role
    value: availablePool
    description: availablePool=可用池, damagedPool=已损坏池。必填参数需要询问用户给出
  - key: uuid
    value: "{{avail_vg1_uuid}}"
    description: 存储池UUID，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/15 获取挂载信息.resources/examples
order: 15000
