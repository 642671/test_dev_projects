$kind: http-request
url: "{{baseUrl}}/v2/storage/CheckMdInfo/:md"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Cookie: "{{Cookie}}"
  X-Csrf-Token: "{{X-Csrf-Token}}"
pathVariables:
  - key: md
    value: "{{vg0_md}}"
    description: md设备名，如md0，必填参数需要询问用户给出
body:
  type: formdata
  content: []
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/19 检查mdadm信息（内部接口）.resources/examples
order: 19000
