$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/CheckAddDisk?uuid=哈哈哈哈&disks=/dev/sda"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: CSRF防护令牌，必须与Cookie中的X-Csrf-Token值保持一致
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 用户会话Cookie。字段说明：userName=当前登录用户名; TMSESSNAME=会话ID(Session ID); X-Csrf-Token=CSRF防护令牌; tos_current_username=当前用户名(与userName保持一致); loginStatus=登录状态标记(true=已登录)
  queryParams:
    - key: uuid
      value: 哈哈哈哈
      description: 存储池 UUID
    - key: disks
      value: /dev/sda
      description: 逗号分隔的目标盘列表，如 `/dev/sda,/dev/sdb`
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
