$kind: http-example
name: uuid参数错误（不存在的存储池）访问编辑存储池接口
request:
  url: "{{baseUrl}}/v2/storage/edit/pool/:uuid"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    - key: uuid
      value: 00000000-0000-0000-0000-000000000000-traid
      description: 存储池UUID，必填参数需要询问用户给出
  body:
    type: json
    content: |-
      {
          "action": "add",
          "disks": [
              "/dev/sdb"
          ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 54000
