$kind: http-example
name: 损坏池single disk/单盘TRAID只检测到一块盘挂载成功
request:
  url: "{{baseUrl}}/v2/storage/MountPool/:role/:uuid"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    - key: role
      value: damagedPool
      description: 类型：availablePool=可用池, damagedPool=已损坏池，必填参数需要询问用户给出
    - key: uuid
      value: "{{corrupt_vg3_uuid}}"
      description: 存储池UUID，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 4000
