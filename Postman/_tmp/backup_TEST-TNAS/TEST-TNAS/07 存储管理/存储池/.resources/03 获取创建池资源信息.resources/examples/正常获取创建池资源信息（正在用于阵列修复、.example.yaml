$kind: http-example
name: 正常获取创建池资源信息（正在用于阵列修复、更换磁盘等的磁盘）
request:
  url: "{{baseUrl}}/v2/storage/create/pool"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
