$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/delete/pool/:uuid"
  method: DELETE
  headers:
    - key: X-CurPass-Token
      value: "{{NormalUser_X-Curpass-Token}}"
      description: 不可为空，密码认证密文
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/x-www-form-urlencoded
  pathVariables:
    - key: uuid
      value: "{{vg1_uuid}}"
      description: 存储池uuid，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 13000
