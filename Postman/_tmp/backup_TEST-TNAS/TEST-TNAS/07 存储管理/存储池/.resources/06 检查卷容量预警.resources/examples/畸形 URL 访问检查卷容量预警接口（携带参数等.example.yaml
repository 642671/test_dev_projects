$kind: http-example
name: 畸形 URL 访问检查卷容量预警接口（携带参数等错误）
request:
  url: "{{baseUrl}}/v2/storage/CheckCapacity"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 8000
