$kind: http-example
name: 正常检查卷容量预警（存在达到预警的卷发通知）
request:
  url: "{{baseUrl}}/v2/storage/CheckCapacity"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
