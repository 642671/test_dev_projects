$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/CheckMdInfo/:md"
  method: POST
  headers:
    X-Csrf-Token: "{{expired_X-Csrf-Token}}"
    Cookie: "{{expired_Cookie}}"
    Content-Type: application/x-www-form-urlencoded
  pathVariables:
    - key: md
      value: "{{vg0_md}}"
      description: md设备名，如md0，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 9000
