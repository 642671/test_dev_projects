$kind: http-example
request:
  url: "{{baseUrl}}/v2/storage/StorageDescription/:uuid"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{expired_X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{expired_Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  pathVariables:
    - key: uuid
      value: "{{vg0_uuid}}"
      description: 存储池UUID，必填参数需要询问用户给出
  body:
    type: json
    content: |-
      {
          "description": "测试存储池描述"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 9000
