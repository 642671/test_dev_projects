$kind: http-example
name: 选中的两块磁盘存在一块已经在阵列中创建存储池失败
request:
  url: "{{baseUrl}}/v2/storage/create/pool"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "level": "raid1",
          "disks": ["{{cp_disk_0_path}}", "{{cp_disk_1_path}}"]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 15000
