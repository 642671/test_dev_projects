$kind: http-example
request:
  url: "{{baseUrl}}/v2/hotsparedisk/ModifyArray"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{expired_X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{expired_Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
          "raids": [
              "{{hs1_vg}}"
          ],
          "blk": "{{hsp1_blk}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 6000
