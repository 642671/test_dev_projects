$kind: http-request
url: "{{baseUrl}}/v2/disk/GetSysDiskLists"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/32 获取系统盘列表（返回全部的磁盘）.resources/examples
order: 32000
