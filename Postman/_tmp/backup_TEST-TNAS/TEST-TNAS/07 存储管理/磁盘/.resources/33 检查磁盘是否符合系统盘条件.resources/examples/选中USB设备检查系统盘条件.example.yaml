$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/CheckSysDisk?disk={{usb_disk_device}}"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: disk
      value: "{{usb_disk_device}}"
      description: 磁盘路径，如/dev/sda，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 2000
