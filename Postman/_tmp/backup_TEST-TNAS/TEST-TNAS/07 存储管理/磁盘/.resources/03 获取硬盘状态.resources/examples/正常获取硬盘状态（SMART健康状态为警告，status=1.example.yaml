$kind: http-example
name: 正常获取硬盘状态（SMART健康状态为警告，status=1）
request:
  url: "{{baseUrl}}/v2/disk/GetDiskStatus"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
