$kind: http-example
name: 已挂载的磁盘分区中只有ntfs、VFAT、exFAT分区获取分区显示为allusers
request:
  url: "{{baseUrl}}/v2/disk/GetPartPerms?device={{disk1_device}}"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: device
      value: "{{disk1_device}}"
      description: 设备路径，如/dev/sda1，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
