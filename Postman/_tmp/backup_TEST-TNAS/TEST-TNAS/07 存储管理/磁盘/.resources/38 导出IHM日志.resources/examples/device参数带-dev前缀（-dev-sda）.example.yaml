$kind: http-example
name: device参数带/dev前缀（/dev/sda）
request:
  url: "{{baseUrl}}/v2/disk/ExportIhmLog?device=/dev/sda"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
  queryParams:
    - key: device
      value: /dev/sda
      description: 设备路径，如/dev/sda，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 14000
