$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/setting"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "CACHE_ENABLED": true,
          "BB_notify_enabled": true,
          "smartest_report": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 19000
