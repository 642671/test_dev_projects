$kind: http-example
name: 正常移除系统盘（存在两块系统盘且该盘为存储池冗余盘）
request:
  url: "{{baseUrl}}/v2/disk/activation/disable"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
    - key: X-Curpass-Token
      value: "{{X-Curpass-Token}}"
      description: 不可为空，密码认证所需token
  body:
    type: json
    content: |-
      {
          "disk": "{{disk1_device}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 11000
