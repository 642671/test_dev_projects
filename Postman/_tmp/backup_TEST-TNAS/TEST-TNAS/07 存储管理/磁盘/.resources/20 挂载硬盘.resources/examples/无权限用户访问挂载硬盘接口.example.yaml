$kind: http-example
request:
  url: "{{baseUrl}}/v2/disk/MountDisk/:name"
  method: POST
  headers:
    - key: X-Csrf-Token
      value: "{{NormalUserCsrfToken}}"
      description: 不可为空，用户认证所需token
    - key: Cookie
      value: "{{NormalUserCookie}}"
      description: 不可为空，用户认证所需cookie
    - key: Content-Type
      value: application/x-www-form-urlencoded
  pathVariables:
    - key: name
      value: ""
      description: 硬盘名称，如sda1，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 7000
