$kind: http-request
url: "{{baseUrl}}/v2/disk/GetDiskAllocations"
method: GET
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/05 获取硬盘分配信息.resources/examples
order: 5000
