$kind: http-example
name: 正常加密USB设备（password为Admin123，大小写加数字8位格式正确）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/EncryptDevice"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "device_name": "{{usb1_name}}",
          "password": "Admin123"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
