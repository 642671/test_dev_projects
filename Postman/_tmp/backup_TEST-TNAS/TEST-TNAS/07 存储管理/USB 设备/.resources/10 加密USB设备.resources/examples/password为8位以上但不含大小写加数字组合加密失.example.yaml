$kind: http-example
name: password为8位以上但不含大小写加数字组合加密失败（AAAAAAAA）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/EncryptDevice"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "device_name": "{{usb1_name}}",
          "password": "AAAAAAAA"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 4000
