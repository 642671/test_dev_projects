$kind: http-example
name: 正常编辑已挂载USB（ext4+XFS+VFAT分区）的ext4、XFS权限为admin成功（携带不可编辑的VFAT分区）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/SetUsbAclAll"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "acls": [
              {
                  "folder": "{{usb1_s1}}",
                  "editable": true,
                  "acl": {
                      "user": "admin",
                      "group": "",
                      "path": "{{usb1_path}}",
                      "type": "usb",
                      "acl": "rwx",
                      "uuid": "{{usb1_uuid}}",
                      "timestamp": 0
                  }
              },
              {
                  "folder": "{{usb1_s2}}",
                  "editable": true,
                  "acl": {
                      "user": "admin",
                      "group": "",
                      "path": "{{usb1_path}}",
                      "type": "usb",
                      "acl": "rwx",
                      "uuid": "{{usb1_uuid}}",
                      "timestamp": 0
                  }
              },
              {
                  "folder": "{{usb1_s3}}",
                  "editable": false,
                  "acl": {
                      "user": "allusers",
                      "group": "",
                      "path": "{{usb1_path}}",
                      "type": "usb",
                      "acl": "rwx",
                      "uuid": "{{usb1_uuid}}",
                      "timestamp": 0
                  }
              }
          ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 10000
