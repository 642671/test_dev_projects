$kind: http-example
name: 正常修改ext4分区卷标（已挂载，label等于15字符）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/EditUsbLabel"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "device_name": "{{usb1_z1}}",
          "label": "aaaaaaaaaaaaaaa"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
