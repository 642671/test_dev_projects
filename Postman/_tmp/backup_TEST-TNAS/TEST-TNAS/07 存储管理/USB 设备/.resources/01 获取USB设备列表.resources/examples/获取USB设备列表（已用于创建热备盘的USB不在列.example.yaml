$kind: http-example
name: 获取USB设备列表（已用于创建热备盘的USB不在列表中展示）
request:
  url: "{{baseUrl}}/v2/extStorageDevice/DeviceList"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 5000
