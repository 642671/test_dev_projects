  type: json
  content: "{\r

    \    \"folder_names\": [\r

    \        \"{{usb1_s1}}\"\r

    \    ]\r

    }"
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/11 批量获取USB访问权限.resources/examples
order: 11000
