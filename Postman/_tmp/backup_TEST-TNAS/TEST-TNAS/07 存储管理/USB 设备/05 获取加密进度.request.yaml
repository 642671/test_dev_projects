$kind: http-request
url: "{{baseUrl}}/v2/extStorageDevice/Process?name={{usb1_device}}"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
queryParams:
  - key: name
    value: "{{usb1_device}}"
    description: 设备名称，文本类型，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/05 获取加密进度.resources/examples
order: 5000
