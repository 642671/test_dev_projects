$kind: http-request
url: "{{baseUrl}}/v2/lvmCache/GetVolumeList"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/03 获取卷列表（获取的是可加速卷）.resources/examples
order: 3000
