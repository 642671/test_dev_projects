$kind: http-request
url: "{{baseUrl}}/v2/lvmCache/GetLvmCacheSort"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/04 获取LVM缓存排序（点击创建的时候触发）.resources/examples
order: 4000
