$kind: http-request
url: "{{baseUrl}}/v2/lvmCache/CacheInfo/:uuid"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
pathVariables:
  - key: uuid
    value: "{{lv0_uuid}}"
    description: 卷UUID，文本类型，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/05 获取指定SSD缓存信息（在卷界面选中卷触发）.resources/examples
order: 5000
