$kind: http-example
name: target正确但lunid为另一个已连接有文件系统的虚拟磁盘卸载失败（target与lunid不匹配）
request:
  url: "{{baseUrl}}/v2/virtualdisk/ClientLunRemove"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: urlencoded
    content:
      target: iqn.tnas.terramaster.26719092407
      lunid: "{{other_lunid}}"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 10000
