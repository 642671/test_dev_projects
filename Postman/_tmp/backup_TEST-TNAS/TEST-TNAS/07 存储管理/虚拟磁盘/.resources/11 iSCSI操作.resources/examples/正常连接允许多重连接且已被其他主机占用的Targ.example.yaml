$kind: http-example
name: 正常连接允许多重连接且已被其他主机占用的Target（action=login）
request:
  url: "{{baseUrl}}/v2/virtualdisk/IscsiAction"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: urlencoded
    content:
      target: "{{iscsi_multi_target}}"
      action: login
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
