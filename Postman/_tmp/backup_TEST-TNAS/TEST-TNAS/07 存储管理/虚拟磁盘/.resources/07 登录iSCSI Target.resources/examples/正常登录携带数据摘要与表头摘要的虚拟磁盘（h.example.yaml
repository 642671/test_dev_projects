$kind: http-example
name: 正常登录携带数据摘要与表头摘要的虚拟磁盘（head=1,data=1）
request:
  url: "{{baseUrl}}/v2/virtualdisk/IscsiLogin"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  body:
    type: json
    content: |-
      {
          "targetName": "iqn.tnas.terramaster.26719092407",
          "ip": "10.18.15.161",
          "port": "3260",
          "head": "1",
          "data": "1",
          "status": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
