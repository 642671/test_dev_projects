$kind: http-example
name: 获取Target认证信息（target参数错误（不存在的target））
request:
  url: "{{baseUrl}}/v2/virtualdisk/GetTargetAttr?target=not.exist.target.name"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  queryParams:
    - key: target
      value: not.exist.target.name
      description: Target名称，文本类型，必填参数需要询问用户给出
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
