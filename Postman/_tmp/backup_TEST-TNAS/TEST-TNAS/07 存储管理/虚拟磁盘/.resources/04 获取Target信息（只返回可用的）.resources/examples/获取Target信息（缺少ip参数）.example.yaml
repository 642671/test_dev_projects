$kind: http-example
request:
  url: "{{baseUrl}}/v2/virtualdisk/GetTargetInfo"
  method: GET
  headers:
    - key: Content-Type
      value: application/json
    - key: Cookie
      value: "{{Cookie}}"
      description: 不可为空，用户认证所需cookie
    - key: X-Csrf-Token
      value: "{{X-Csrf-Token}}"
      description: 不可为空，用户认证所需token
  pathVariables:
    port: "3260"
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 3000
