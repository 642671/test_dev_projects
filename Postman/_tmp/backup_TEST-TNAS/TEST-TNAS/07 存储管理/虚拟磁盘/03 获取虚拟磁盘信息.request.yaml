$kind: http-request
url: "{{baseUrl}}/v2/virtualdisk/GetIscsiInfo"
method: GET
headers:
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/03 获取虚拟磁盘信息.resources/examples
order: 4000
