$kind: http-request
url: "{{baseUrl}}/v2/virtualdisk/RemoveIscsi"
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
  - key: Cookie
    value: "{{Cookie}}"
    description: 不可为空，用户认证所需cookie
  - key: X-Csrf-Token
    value: "{{X-Csrf-Token}}"
    description: 不可为空，用户认证所需token
body:
  type: formdata
  content:
    - type: text
      key: target
      value: ""
      description: 要删除的Target IQN名称，必填参数需要询问用户给出
settings:
  strictSSL: false
  followRedirects: true
examples: ./.resources/12 删除iSCSI连接.resources/examples
order: 13000
