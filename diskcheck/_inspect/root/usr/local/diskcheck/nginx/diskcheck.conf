location = /diskcheck {
    return 302 $scheme://$http_host/diskcheck/;
}

location /diskcheck/ {
    proxy_pass http://127.0.0.1:16689/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # TOS adds these headers at the outer HTTPS layer. Hide the identical
    # upstream values so clients receive one authoritative field, not two.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
}
